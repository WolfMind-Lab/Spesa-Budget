<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa — Budget">
<title>Spesa — Budget V6.2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;padding:calc(8px + env(safe-area-inset-top)) 10px calc(20px + env(safe-area-inset-bottom))}
.app{max-width:680px;margin:auto}header{padding:5px 4px 9px}.head{display:flex;align-items:center;gap:8px}.head h1{flex:1;margin:0;font-size:22px;letter-spacing:-.5px}.sub{font-size:12px;color:#777;margin-top:3px}
.card,.list,.summary{background:#fff;border-radius:15px;margin-bottom:8px}.card{padding:10px}.top{display:flex;gap:6px;align-items:center}.top label{font-size:13px;color:#666;font-weight:700}.top input{width:86px;height:38px}.new{margin-left:auto}
input,select{border:1px solid #d7d7dd;border-radius:10px;padding:8px 9px;font-size:16px;background:#fff;color:#111}button{border:0;background:#111;color:#fff;border-radius:10px;min-height:38px;padding:0 12px;font-weight:700;font-size:13px;touch-action:manipulation}.gray{background:#e9e9ee;color:#222}.danger{background:#c62828;color:#fff}
.summary{display:flex;padding:10px 4px}.metric{flex:1;text-align:center;border-right:1px solid #eee}.metric:last-child{border:0}.metric small{display:block;color:#777;font-size:10px}.metric b{display:block;font-size:16px;margin-top:2px}.green{color:#16823b}.red{color:#c62828}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.grid button{min-height:42px;font-size:11px}
.section-head{padding:11px 12px;background:#f2f2f7;border-bottom:1px solid #e7e7eb;font-weight:800;font-size:14px}.row{padding:10px;border-bottom:1px solid #eee}.rowtop{display:flex;gap:6px;align-items:flex-start}.name{flex:1;font-weight:750;font-size:14px}.note{font-size:10px;color:#888;font-weight:400;line-height:1.3;margin-top:3px}.nums{font-size:10px;color:#666;white-space:nowrap}.entry{display:flex;gap:5px;margin-top:7px}.qty{width:65px;text-align:center}.price{flex:1;min-width:0}.plus{width:48px;font-size:20px}.hist{font-size:10px;color:#888;margin-top:5px;overflow-x:auto;white-space:nowrap}.alert{display:inline-block;margin-top:6px;padding:5px 7px;border-radius:8px;background:#fff1f1;color:#b42318;font-size:10px}.badge{display:inline-block;padding:2px 6px;border-radius:999px;background:#eee;color:#666;font-size:10px;font-weight:600}
.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.muted{color:#777;font-size:11px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}.sheet h2{font-size:19px;margin:0 0 12px}.line{display:flex;gap:7px;margin:7px 0}.line>*{flex:1;min-width:0}.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:13px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.small{min-height:30px;padding:0 8px;font-size:11px}.stat{border:1px solid #eee;border-radius:10px;padding:10px;margin:7px 0;background:#fafafa}.check{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.grow{flex:1}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.successbox{background:#d1e7dd;padding:9px;border-radius:10px}.dangerbox{background:#f8d7da;padding:9px;border-radius:10px}.search{width:100%;margin-bottom:8px}.done{text-decoration:line-through;color:#999}
.offerbox{background:#fff8df;border:1px solid #f0df9a;padding:9px;border-radius:10px;margin-top:8px}.qtygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:5px}.qtygrid button{min-height:34px}.qtygrid button.sel{background:#111;color:#fff}.qtygrid button:not(.sel){background:#e9e9ee;color:#222}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><h1>🛒 SPESA — BUDGET V6.2</h1><button class="gray" id="settings">⚙️</button></div><div class="sub">Budget sincronizzato · quantità · offerte · prodotti collegati alle categorie.</div></header>

<div class="card top"><label>💰 Budget</label><input id="budget" type="number" inputmode="decimal" step=".01"><button id="setBudget">Imposta</button><button class="gray new" id="new">↻ Nuova</button></div>
<div class="summary"><div class="metric"><small>Budget</small><b id="bTot"></b></div><div class="metric"><small>Speso</small><b id="sTot"></b></div><div class="metric"><small>Rimasto</small><b id="rTot"></b></div><div class="metric"><small>Stato</small><b id="status"></b></div></div>

<div class="grid">
<button class="gray" id="listBtn">📝 Lista</button><button class="gray" id="productsBtn">🏷️ Prodotti</button><button class="gray" id="pantryBtn">📦 Dispensa</button>
<button class="gray" id="statsBtn">📊 Statistiche</button><button class="gray" id="historyBtn">📋 Storico</button><button class="gray" id="searchBtn">🔎 Ricerca</button>
<button class="gray" id="catsBtn">🗂️ Categorie</button><button class="gray" id="budgetCats">🎯 Budget categorie</button><button class="gray" id="backupBtn">💾 Backup</button>
</div>

<div class="list" id="main"></div>
<div class="card footer"><span>Budget categorie selezionate: <b id="catBudget"></b></span><button class="gray" id="budgetCats2">⚙️ Distribuisci</button></div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const KEY="spesaBudgetData",VERSION=6.2;
const DEFAULTS=[
["🛒 SPESA ALIMENTARE","🍝 Pasta, riso, cereali e farine",20,"Pasta · Riso · Cereali · Farina · Semola · Zucchero"],
["🛒 SPESA ALIMENTARE","🥫 Conserve e legumi",15,"Passata · Pelati · Concentrato · Sughi · Ceci · Fagioli · Lenticchie · Piselli · Olive · Mais"],
["🛒 SPESA ALIMENTARE","🥩 Carne",45,"Pollo · Manzo · Macinato · Salsiccia · Carne fresca"],
["🛒 SPESA ALIMENTARE","🐟 Pesce",5,"Pesce fresco · Salmone · Merluzzo · Frutti di mare · Tonno"],
["🛒 SPESA ALIMENTARE","🥛 Latte, yogurt e formaggi",15,"Latte · Yogurt · Mozzarella · Formaggi · Panna"],
["🛒 SPESA ALIMENTARE","🥦 Verdura",15,"Melanzane · Zucchine · Patate · Carote · Insalata"],
["🛒 SPESA ALIMENTARE","🍎 Frutta",0,"Mele · Banane · Arance · Pere · Uva"],
["🛒 SPESA ALIMENTARE","🍞 Pane e prodotti da forno",8,"Pane · Focaccia · Piadine · Panini · Crackers"],
["🛒 SPESA ALIMENTARE","☕ Colazione",5,"Biscotti · Cereali · Marmellata · Cacao · Miele"],
["🛒 SPESA ALIMENTARE","🍪 Snack e dolci",7,"Patatine · Crackers · Cioccolato · Merendine · Dolci"],
["🛒 SPESA ALIMENTARE","🥤 Bevande",5,"Acqua · Succhi · Bibite · Tè freddo"],
["🛒 SPESA ALIMENTARE","☕ Caffè e tè",4,"Caffè · Tè · Camomilla · Tisane"],
["🛒 SPESA ALIMENTARE","🫒 Olio, condimenti e spezie",6,"Olio · Aceto · Sale · Pepe · Spezie · Maionese · Ketchup · Salse"],
["🛒 SPESA ALIMENTARE","🧊 Surgelati",17.5,"Verdure surgelate · Patatine · Pesce surgelato · Gelati · Pizza · Altri surgelati"],
["🛒 SPESA ALIMENTARE","❄️ Frigorifero",17.5,"Insalata · Pasta fresca · Salumi · Pancetta · Burro · Dadi · Würstel · Pomodori · Zucca · Olive"],
["🐱 GATTI","🥣 Croccantini",0,""],
["🐱 GATTI","🪣 Lettiera",0,""],
["🏠 CASA & PULIZIA","🏠 Casa",15,"Detersivo pavimenti · Carta igienica · Buste immondizia · detergenti"],
["🏠 CASA & PULIZIA","🍽️ Tavola",5,"Scottex · Piatti · Bicchieri · Detersivo piatti · Spugne"],
["🏠 CASA & PULIZIA","👕 Lavatrice",0,"Detersivo lavatrice · Ammorbidente"]
];

const $=id=>document.getElementById(id);
const money=n=>Math.round(Number(n||0)*100)/100;
const euro=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);

function fresh(){
 return {schemaVersion:VERSION,budget:200,cats:DEFAULTS.map(x=>({section:x[0],name:x[1],budget:x[2],note:x[3],selected:x[2]>0,items:[]})),history:[],shoppingList:[],products:[],supermarkets:[],pantry:[]};
}
function migrate(x){
 if(!x||!Array.isArray(x.cats))return fresh();
 x.budget=Number(x.budget??200);
 x.history=Array.isArray(x.history)?x.history:[];
 x.shoppingList=Array.isArray(x.shoppingList)?x.shoppingList:[];
 x.products=Array.isArray(x.products)?x.products:[];
 x.supermarkets=Array.isArray(x.supermarkets)?x.supermarkets:[];
 x.pantry=Array.isArray(x.pantry)?x.pantry:[];
 x.cats.forEach(c=>{
   if(c.selected===undefined)c.selected=!(c.name==="🍎 Frutta"||c.section==="🐱 GATTI"||c.name==="👕 Lavatrice");
   if(c.selected===false)c.budget=0;
   c.items=Array.isArray(c.items)?c.items.map(v=>typeof v==="number"?{id:uid(),name:"",qty:1,price:v,normalPrice:v,offerPrice:0,isOffer:false}:{...v,id:v.id||uid(),name:v.name||"",qty:Number(v.qty||1),price:Number(v.price||0),normalPrice:Number(v.normalPrice??v.price??0),offerPrice:Number(v.offerPrice||0),isOffer:Boolean(v.isOffer)}):[];
 });
 x.products.forEach(p=>{p.priceHistory=Array.isArray(p.priceHistory)?p.priceHistory:[]});
 x.schemaVersion=VERSION;
 return x;
}
let data;
try{data=migrate(JSON.parse(localStorage.getItem(KEY)||"null")||fresh())}catch(e){data=fresh()}
function save(){data.schemaVersion=VERSION;localStorage.setItem(KEY,JSON.stringify(data))}
function catSum(c){return c.items.reduce((a,x)=>a+money(x.price)*Number(x.qty||1),0)}
function spent(){return data.cats.reduce((a,c)=>a+catSum(c),0)}
function selectedCatBudget(){return data.cats.filter(c=>c.selected!==false).reduce((a,c)=>a+Number(c.budget||0),0)}
function open(html){$("sheet").innerHTML=html;$("modal").classList.add("open")}
function close(){$("modal").classList.remove("open")}
$("modal").onclick=e=>{if(e.target===$("modal"))close()};

function render(){
 $("budget").value=data.budget;
 $("bTot").textContent=euro(data.budget);
 $("sTot").textContent=euro(spent());
 const r=money(data.budget-spent());
 $("rTot").textContent=euro(r);$("rTot").className=r<0?"red":"green";
 $("status").textContent=r<0?"Superato":"OK";$("status").className=r<0?"red":"green";
 const cb=money(selectedCatBudget());
 $("catBudget").textContent=euro(cb)+(Math.abs(cb-data.budget)<.01?"":" ⚠️");
 let out="",last="";
 data.cats.forEach((c,i)=>{
   if(c.section!==last){out+=`<div class="section-head">${esc(c.section)}</div>`;last=c.section}
   const s=catSum(c),rem=money(Number(c.budget||0)-s),ex=c.selected===false;
   out+=`<div class="row"><div class="rowtop"><div class="name">${esc(c.name)} ${ex?'<span class="badge">Esclusa</span>':""}<div class="note">${esc(c.note)}</div></div><div class="nums">B. ${euro(c.budget)} · S. ${euro(s)} · <span class="${rem<0?"red":""}">R. ${euro(rem)}</span></div></div>`;
   if(!ex){
     out+=`<div class="entry"><select class="qty" id="q${i}">${Array.from({length:10},(_,n)=>`<option value="${n+1}">${n+1}</option>`).join("")}<option value="custom">Altro…</option></select><input class="price" id="p${i}" type="number" min="0" step=".01" inputmode="decimal" placeholder="Prezzo rapido €"><button class="gray" data-name="${i}">Nome</button><button class="plus" data-add="${i}">+</button></div>`;
     if(rem<0)out+=`<div class="alert">⚠️ Superato di ${euro(-rem)}</div>`;
     if(c.items.length)out+=`<div class="hist">${c.items.slice(-5).map((x,j)=>`<button class="gray small" data-edit="${i},${c.items.length-1-j}">${x.name?esc(x.name)+" · ":""}${euro(x.price)} × ${x.qty}${x.isOffer?" 🏷️":""}</button>`).join("")}</div>`;
   }else out+=`<div class="note">Questa categoria non partecipa ai 200 €.</div>`;
   out+="</div>";
 });
 $("main").innerHTML=out;
 data.cats.forEach((c,i)=>{const q=$("q"+i),p=$("p"+i);if(q)q.onchange=()=>{if(q.value==="custom"){let n=Math.max(11,parseInt(prompt("Quantità personalizzata","11"),10)||11);q.innerHTML=Array.from({length:10},(_,z)=>`<option value="${z+1}">${z+1}</option>`).join("")+`<option value="${n}">${n}</option>`;q.value=n}};if(p)p.onkeydown=e=>{if(e.key==="Enter")openPurchase(i)}})
}

function openPurchase(i){
 const c=data.cats[i];
 const list=data.products.filter(p=>p.category===c.name||!p.category);
 open(`<h2>🛒 Aggiungi a ${esc(c.name)}</h2>
 <label class="muted">Nome prodotto collegato alla categoria</label>
 <input id="pn" list="prodNames" placeholder="Scegli o scrivi il prodotto" style="width:100%;margin-top:4px">
 <datalist id="prodNames">${list.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist>
 <div class="two" style="margin-top:8px"><div><label class="muted">Prezzo normale €</label><input id="np" type="number" min="0" step=".01" style="width:100%"></div><div><label class="muted">Supermercato</label><select id="market" style="width:100%"><option value="">Non specificato</option>${data.supermarkets.map(m=>`<option>${esc(m)}</option>`).join("")}</select></div></div>
 <div class="check"><input id="isOffer" type="checkbox"><div class="grow"><b>🏷️ È in offerta</b><div class="muted">Il prezzo dell'offerta sostituisce quello normale nel calcolo.</div></div></div>
 <div class="offerbox" id="offerBox" style="display:none"><label class="muted">Prezzo dell'offerta €</label><input id="op" type="number" min="0" step=".01" style="width:100%"></div>
 <label class="muted" style="display:block;margin-top:8px">Quantità</label>
 <div class="qtygrid">${Array.from({length:10},(_,n)=>`<button type="button" data-q="${n+1}" class="${n===0?"sel":""}">${n+1}</button>`).join("")}</div>
 <div class="line"><input id="customQty" type="number" min="1" placeholder="Quantità personalizzata"><div class="successbox" id="totalPreview">Totale: <b>0,00 €</b></div></div>
 <button id="savePurchase" style="width:100%">＋ Aggiungi acquisto</button><button class="gray" id="cancel" style="width:100%;margin-top:6px">Annulla</button>`);
 let qty=1;
 const preview=()=>{const n=parseFloat(String($("np").value||0).replace(",",".")),o=parseFloat(String($("op").value||0).replace(",",".")),p=$("isOffer").checked&&o>0?o:n,q=Math.max(1,parseInt($("customQty").value||qty,10)||qty);$("totalPreview").innerHTML=`Totale: <b>${euro(money(p*q))}</b>`;return{p,n,o,q}};
 $("isOffer").onchange=()=>{$("offerBox").style.display=$("isOffer").checked?"block":"none";preview()};
 ["np","op","customQty"].forEach(x=>$(x).oninput=preview);
 $("pn").onchange=()=>{const p=data.products.find(x=>x.name.toLowerCase()=== $("pn").value.trim().toLowerCase());if(p){$("np").value=p.price||"";if(p.offerPrice)$("op").value=p.offerPrice;if(p.lastMarket)$("market").value=p.lastMarket;preview()}};
 $("sheet").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("sheet").querySelectorAll("[data-q]").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");qty=Number(b.dataset.q);$("customQty").value="";preview()});
 $("cancel").onclick=close;
 $("savePurchase").onclick=()=>{
   const name=$("pn").value.trim();if(!name){alert("Inserisci o seleziona il nome del prodotto.");return}
   const {p,n,o,q}=preview();if(!Number.isFinite(p)||p<=0){alert("Inserisci un prezzo valido.");return}
   const isOffer=$("isOffer").checked&&o>0,market=$("market").value;
   const x={id:uid(),name,price:money(p),qty:q,normalPrice:money(n||p),offerPrice:isOffer?money(o):0,isOffer};
   c.items.push(x);
   data.history.push({id:x.id,date:new Date().toLocaleString("it-IT"),product:name,cat:c.name,qty:q,price:x.price,total:money(x.price*q),normalPrice:x.normalPrice,offerPrice:x.offerPrice,isOffer,market});
   let prod=data.products.find(p=>p.name.trim().toLowerCase()===name.toLowerCase());
   if(!prod){prod={name,category:c.name,price:x.price,offerPrice:x.offerPrice,lastMarket:market,priceHistory:[]};data.products.push(prod)}
   prod.category=c.name;prod.price=x.price;prod.offerPrice=x.offerPrice;prod.lastMarket=market||prod.lastMarket||"";
   prod.priceHistory.push({date:new Date().toLocaleString("it-IT"),price:x.price,normalPrice:x.normalPrice,offerPrice:x.offerPrice,isOffer,market,category:c.name});
   const listItem=data.shoppingList.find(z=>z.name.toLowerCase()===name.toLowerCase()&&!z.done);if(listItem){listItem.done=true;listItem.purchased=true;listItem.purchasedPrice=x.price}
   save();close();render();
 };
 preview();
}

function editPurchase(i,j){
 const c=data.cats[i],x=c.items[j],h=data.history.find(z=>z.id===x.id);
 open(`<h2>✏️ Modifica acquisto</h2><div class="line"><input id="eq" type="number" min="1" value="${x.qty}"><input id="ep" type="number" step=".01" value="${x.price}"></div><button id="saveEdit" style="width:100%">Salva</button><button class="gray" id="deleteEdit" style="width:100%;margin-top:6px">🗑️ Elimina</button><button class="gray" id="cancel" style="width:100%;margin-top:6px">Annulla</button>`);
 $("cancel").onclick=close;$("deleteEdit").onclick=()=>{c.items.splice(j,1);if(h)data.history=data.history.filter(z=>z.id!==x.id);save();close();render()};
 $("saveEdit").onclick=()=>{const q=Math.max(1,parseInt($("eq").value||1,10)||1),p=parseFloat(String($("ep").value).replace(",","."));if(!Number.isFinite(p)||p<=0)return;x.qty=q;x.price=money(p);if(h){h.qty=q;h.price=x.price;h.total=money(p*q)}save();close();render()};
}

function budgetCats(){
 open(`<h2>🎯 Distribuisci il budget</h2><div class="stat">Budget generale: <b>${euro(data.budget)}</b><br>Totale categorie selezionate: <b id="mTotal">${euro(selectedCatBudget())}</b></div>
 <div class="actions"><button class="gray small" id="auto">⚖️ Ripartisci</button><button class="gray small" id="on">Seleziona tutte</button><button class="gray small" id="off">Deseleziona tutte</button></div>
 <div id="budgetRows">${data.cats.map((c,i)=>`<div class="check"><input type="checkbox" id="sel${i}" ${c.selected!==false?"checked":""}><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.section)}</div></div><input id="bud${i}" type="number" min="0" step=".01" value="${c.selected===false?0:c.budget}" style="width:88px"></div>`).join("")}</div>
 <div id="bw" class="alert" style="display:none"></div><button id="saveBud" style="width:100%;margin-top:8px">Salva distribuzione</button><button class="gray" id="cancel" style="width:100%;margin-top:6px">Annulla</button>`);
 const refresh=()=>{let t=0;data.cats.forEach((c,i)=>{const on=$("sel"+i).checked;$("bud"+i).disabled=!on;const v=Number(String($("bud"+i).value||0).replace(",","."));if(on)t+=Number.isFinite(v)?Math.max(0,v):0});t=money(t);$("mTotal").textContent=euro(t);const d=money(t-data.budget);$("bw").style.display=Math.abs(d)>.01?"inline-block":"none";$("bw").textContent=d>0?`⚠️ Superi il budget di ${euro(d)}.`:`⚠️ Devi ancora distribuire ${euro(-d)}.`};
 data.cats.forEach((c,i)=>{["change","input"].forEach(ev=>{$("sel"+i).addEventListener(ev,refresh);$("bud"+i).addEventListener(ev,refresh)})});
 $("on").onclick=()=>{data.cats.forEach((c,i)=>{$("sel"+i).checked=true});refresh()};
 $("off").onclick=()=>{data.cats.forEach((c,i)=>{$("sel"+i).checked=false;$("bud"+i).value=0});refresh()};
 $("auto").onclick=()=>{const chosen=data.cats.map((c,i)=>i).filter(i=>$("sel"+i).checked);if(!chosen.length)return;const old=chosen.map(i=>Math.max(0,Number($("bud"+i).value)||0)),sum=old.reduce((a,b)=>a+b,0);chosen.forEach((i,k)=>$("bud"+i).value=(sum?data.budget*old[k]/sum:data.budget/chosen.length).toFixed(2));let total=chosen.reduce((a,i)=>a+Number($("bud"+i).value),0),diff=money(data.budget-total);const last=chosen[chosen.length-1];$("bud"+last).value=(Number($("bud"+last).value)+diff).toFixed(2);refresh()};
 $("saveBud").onclick=()=>{let t=0;data.cats.forEach((c,i)=>{c.selected=$("sel"+i).checked;if(!c.selected)c.budget=0;else{const v=Number(String($("bud"+i).value||0).replace(",","."));c.budget=Number.isFinite(v)&&v>=0?money(v):0;t+=c.budget}});t=money(t);if(Math.abs(t-data.budget)>.01){alert(`La distribuzione deve essere esattamente ${euro(data.budget)}. Attuale: ${euro(t)}.`);return}save();close();render()};
 $("cancel").onclick=close;refresh();
}

function setBudget(){
 const v=Number(String($("budget").value).replace(",","."));
 if(!Number.isFinite(v)||v<0)return;
 const old=data.budget;data.budget=money(v);
 if(Math.abs(selectedCatBudget()-old)<.01){
   const chosen=data.cats.filter(c=>c.selected!==false);
   if(chosen.length){const ratio=v/(old||1);chosen.forEach(c=>c.budget=money(c.budget*ratio));let diff=money(v-selectedCatBudget());chosen[chosen.length-1].budget=money(chosen[chosen.length-1].budget+diff)}
 }
 save();render();
}

function list(){
 const rows=data.shoppingList.map((x,i)=>`<div class="check"><input type="checkbox" data-ch="${i}" ${x.done?"checked":""}><div class="grow ${x.done?"done":""}"><b>${esc(x.name)}</b><div class="muted">Quantità: ${x.qty||1}${x.purchasedPrice?` · acquistato a ${euro(x.purchasedPrice)}`:""}</div></div><button class="gray small" data-rm="${i}">×</button></div>`).join("")||"<p>Lista vuota.</p>";
 open(`<h2>📝 Lista della spesa</h2><div class="line"><input id="ln" placeholder="Nome prodotto"><select id="lq">${Array.from({length:10},(_,n)=>`<option>${n+1}</option>`).join("")}</select></div><button id="addL" style="width:100%">＋ Aggiungi alla lista</button>${rows}<button class="gray" id="close" style="width:100%;margin-top:8px">Chiudi</button>`);
 $("close").onclick=close;$("addL").onclick=()=>{const n=$("ln").value.trim(),q=Number($("lq").value);if(!n)return;if(!data.shoppingList.some(x=>x.name.toLowerCase()===n.toLowerCase()&&!x.done))data.shoppingList.push({name:n,qty:q,done:false});save();list()};
 $("sheet").querySelectorAll("[data-ch]").forEach(e=>e.onchange=()=>{data.shoppingList[+e.dataset.ch].done=e.checked;save();list()});
 $("sheet").querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{data.shoppingList.splice(+e.dataset.rm,1);save();list()});
}

function products(){
 const rows=data.products.map((p,i)=>`<div class="item"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.category||"Categoria non assegnata")} · Ultimo ${euro(p.price)}${p.offerPrice?` · 🏷️ offerta ${euro(p.offerPrice)}`:""}${p.lastMarket?" · "+esc(p.lastMarket):""}</div></div><div class="actions"><button class="gray small" data-ph="${i}">Storico</button><button class="gray small" data-del="${i}">×</button></div></div>`).join("")||"<p>Nessun prodotto archiviato.</p>";
 open(`<h2>🏷️ Prodotti</h2><p class="muted">Ogni prodotto è collegato alla categoria in cui viene registrato.</p>${rows}<button class="gray" id="close" style="width:100%;margin-top:8px">Chiudi</button>`);
 $("close").onclick=close;$("sheet").querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{data.products.splice(+e.dataset.del,1);save();products()});
 $("sheet").querySelectorAll("[data-ph]").forEach(e=>e.onclick=()=>{const p=data.products[+e.dataset.ph];const rows=(p.priceHistory||[]).slice().reverse().map(h=>`<div class="item"><span>${esc(h.date)}<br><small>${esc(h.category||"")} · ${esc(h.market||"")}${h.isOffer?" · 🏷️":""}</small></span><b>${euro(h.price)}</b></div>`).join("");open(`<h2>🏷️ ${esc(p.name)}</h2>${rows||"<p>Nessun prezzo storico.</p>"}<button class="gray" onclick="products()">Indietro</button>`)});
}

function history(){
 const rows=data.history.slice().reverse().map(x=>`<div class="item"><span><b>${esc(x.product||x.cat)}</b><br><small>${esc(x.date)} · ${esc(x.cat)} · ${x.qty}×${x.isOffer?" · 🏷️ offerta":""}${x.market?" · "+esc(x.market):""}</small></span><b>${euro(x.total)}</b></div>`).join("")||"<p>Nessun movimento.</p>";
 open(`<h2>📋 Storico</h2>${rows}<button class="gray" id="close" style="width:100%;margin-top:8px">Chiudi</button>`);$("close").onclick=close;
}

function stats(){
 const by=data.cats.filter(c=>catSum(c)>0).sort((a,b)=>catSum(b)-catSum(a));
 open(`<h2>📊 Statistiche</h2><div class="stat">Spesa totale: <b>${euro(spent())}</b><br>Movimenti: <b>${data.history.length}</b><br>Rimanenza budget: <b>${euro(data.budget-spent())}</b></div><h3>Categorie</h3>${by.map(c=>`<div class="item"><span>${esc(c.name)}</span><b>${euro(catSum(c))}</b></div>`).join("")||"<p>Nessun dato.</p>"}<button class="gray" id="close" style="width:100%;margin-top:8px">Chiudi</button>`);$("close").onclick=close;
}

function search(){
 open(`<h2>🔎 Ricerca</h2><input id="sq" class="search" placeholder="Prodotto, categoria o supermercato"><div id="sr"></div><button class="gray" id="close" style="width:100%">Chiudi</button>`);$("close").onclick=close;
 const run=()=>{const q=$("sq").value.toLowerCase().trim(),r=[];data.products.forEach(p=>{if(!q||p.name.toLowerCase().includes(q)||String(p.category).toLowerCase().includes(q))r.push("🏷️ "+p.name+" — "+(p.category||"")+" — "+euro(p.price))});data.cats.forEach(c=>{if(!q||c.name.toLowerCase().includes(q))r.push("🗂️ "+c.name)});data.supermarkets.forEach(m=>{if(!q||m.toLowerCase().includes(q))r.push("🏪 "+m)});$("sr").innerHTML=r.slice(0,100).map(x=>`<div class="item">${esc(x)}</div>`).join("")||"<p>Nessun risultato.</p>"};$("sq").oninput=run;run();setTimeout(()=>$("sq").focus(),50);
}

function pantry(){
 const rows=data.pantry.map((p,i)=>`<div class="item"><div class="grow"><b>${esc(p.name)}</b><div class="muted">Quantità: ${p.qty||0} · minimo: ${p.min||0}</div></div><div class="actions"><button class="gray small" data-pm="${i}">−</button><button class="gray small" data-pp="${i}">+</button><button class="gray small" data-pd="${i}">×</button></div></div>`).join("")||"<p>Dispensa vuota.</p>";
 open(`<h2>📦 Dispensa</h2><button id="pa" style="width:100%">＋ Aggiungi prodotto</button>${rows}<button class="gray" id="close" style="width:100%;margin-top:8px">Chiudi</button>`);
 $("close").onclick=close;$("pa").onclick=()=>{const n=prompt("Prodotto");if(!n?.trim())return;data.pantry.push({name:n.trim(),qty:Number(prompt("Quantità","1"))||0,min:Number(prompt("Soglia minima","1"))||0});save();pantry()};
 $("sheet").querySelectorAll("[data-pm]").forEach(e=>e.onclick=()=>{const p=data.pantry[+e.dataset.pm];p.qty=Math.max(0,(p.qty||0)-1);save();pantry()});$("sheet").querySelectorAll("[data-pp]").forEach(e=>e.onclick=()=>{const p=data.pantry[+e.dataset.pp];p.qty=(p.qty||0)+1;save();pantry()});$("sheet").querySelectorAll("[data-pd]").forEach(e=>e.onclick=()=>{data.pantry.splice(+e.dataset.pd,1);save();pantry()});
}

function cats(){
 const rows=data.cats.map((c,i)=>`<div class="item"><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.section)} · ${c.selected===false?"Esclusa":euro(c.budget)}</div></div><button class="gray small" data-editcat="${i}">✏️</button><button class="gray small" data-delcat="${i}">×</button></div>`).join("");
 open(`<h2>🗂️ Categorie</h2>${rows}<button id="addcat" style="width:100%;margin-top:8px">＋ Nuova categoria</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);$("close").onclick=close;
 $("addcat").onclick=()=>{const n=prompt("Nome categoria");if(!n?.trim())return;data.cats.push({section:"🛒 SPESA ALIMENTARE",name:n.trim(),budget:0,selected:false,note:"",items:[]});save();cats();render()};
 $("sheet").querySelectorAll("[data-editcat]").forEach(e=>e.onclick=()=>{const c=data.cats[+e.dataset.editcat],n=prompt("Nome categoria",c.name);if(n?.trim())c.name=n.trim();const note=prompt("Descrizione prodotti",c.note||"");if(note!==null)c.note=note;save();cats();render()});
 $("sheet").querySelectorAll("[data-delcat]").forEach(e=>e.onclick=()=>{const i=+e.dataset.delcat;if(catSum(data.cats[i])>0){alert("Non puoi eliminare una categoria con spese registrate.");return}if(confirm("Eliminare la categoria?")){data.cats.splice(i,1);save();cats();render()}});
}

function backup(){
 open(`<h2>💾 Backup</h2><p class="muted">Salva budget, categorie, acquisti, lista, prodotti, offerte, supermercati, dispensa e storico.</p><button id="export" style="width:100%">⬇️ Esporta backup</button><button class="gray" id="imp" style="width:100%;margin-top:6px">⬆️ Importa backup</button><input id="file" type="file" accept=".json,application/json" hidden><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="spesa-budget-v6.2-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("imp").onclick=()=>$("file").click();$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=migrate(JSON.parse(r.result));save();close();render();alert("Backup importato.");}catch(x){alert("Backup non valido.")}};r.readAsText(f)};
}

function settings(){
 open(`<h2>⚙️ Impostazioni</h2><div class="stat"><b>Spesa — Budget V6.2</b><div class="muted">Dati salvati localmente sul dispositivo.</div></div><button id="reset" style="width:100%">↺ Ripristina categorie e budget V6.2</button><button class="danger" id="wipe" style="width:100%;margin-top:6px">🗑️ Elimina tutti i dati</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;$("reset").onclick=()=>{if(confirm("Ripristinare i budget V6.2? Gli acquisti non vengono cancellati.")){DEFAULTS.forEach(d=>{const c=data.cats.find(x=>x.name===d[1]);if(c){c.budget=d[2];c.selected=d[2]>0;c.note=d[3]}});save();close();render()}};$("wipe").onclick=()=>{if(confirm("Eliminare tutti i dati?")){data=fresh();save();close();render()}};
}

$("main").onclick=e=>{const a=e.target.closest("[data-add]"),n=e.target.closest("[data-name]"),ed=e.target.closest("[data-edit]");if(a||n)openPurchase(+(a?.dataset.add??n.dataset.name));else if(ed){const [i,j]=ed.dataset.edit.split(",").map(Number);editPurchase(i,j)}};
$("setBudget").onclick=setBudget;$("budgetCats").onclick=budgetCats;$("budgetCats2").onclick=budgetCats;$("settings").onclick=settings;$("new").onclick=()=>{if(confirm("Azzerare la spesa corrente? Budget, categorie e prodotti restano invariati.")){data.cats.forEach(c=>c.items=[]);data.history=[];save();render()}};
$("listBtn").onclick=list;$("productsBtn").onclick=products;$("pantryBtn").onclick=pantry;$("statsBtn").onclick=stats;$("historyBtn").onclick=history;$("searchBtn").onclick=search;$("catsBtn").onclick=cats;$("backupBtn").onclick=backup;
render();
</script>
</body>
</html>

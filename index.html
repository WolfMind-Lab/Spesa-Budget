<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="application-name" content="Spesa — Budget">
<link rel="manifest" href="manifest.webmanifest">
<title>Spesa — Budget</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;padding:calc(8px + env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom))}
.app{max-width:640px;margin:auto}header{padding:5px 4px 9px}.head{display:flex;align-items:center;gap:8px}.head h1{flex:1;margin:0;font-size:22px;letter-spacing:-.5px}.sub{font-size:12px;color:#777;margin:2px 0 0}
.card,.list,.summary{background:#fff;border-radius:14px;margin-bottom:8px}.card{padding:10px}.top{display:flex;gap:6px;align-items:center}.top label{font-size:12px;color:#666;font-weight:700}.top input{width:82px;height:36px}.top .new{margin-left:auto}
input,select{border:1px solid #d8d8dd;border-radius:9px;padding:7px 9px;font-size:16px;background:#fff}button{border:0;background:#111;color:#fff;border-radius:9px;min-height:36px;padding:0 11px;font-weight:700;font-size:13px;touch-action:manipulation}.gray{background:#e9e9ee;color:#222}.danger{background:#c62828;color:#fff}
.summary{display:flex;padding:10px 4px}.metric{flex:1;text-align:center;border-right:1px solid #eee}.metric:last-child{border:0}.metric small{display:block;color:#777;font-size:10px}.metric b{display:block;font-size:16px;margin-top:2px}.green{color:#16823b}.red{color:#c62828}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.grid button{min-height:40px;font-size:11px}
.section-head{padding:10px 12px;background:#f2f2f7;border-bottom:1px solid #e7e7eb;font-weight:800;font-size:14px}.row{padding:9px 10px;border-bottom:1px solid #eee}.row:last-child{border:0}.rowtop{display:flex;gap:5px;align-items:flex-start}.name{flex:1;font-weight:700;font-size:14px}.note{font-size:10px;color:#888;font-weight:400;line-height:1.25;margin-top:2px}.nums{font-size:10px;color:#666;white-space:nowrap}.entry{display:flex;gap:5px;margin-top:6px}.qty{width:50px;text-align:center}.price{flex:1;min-width:0}.plus{width:46px;font-size:20px}.hist{font-size:10px;color:#888;margin-top:4px;overflow-x:auto;white-space:nowrap}.alert{display:inline-block;margin-top:5px;padding:4px 6px;border-radius:7px;background:#fff1f1;color:#b42318;font-size:10px}
.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.muted{color:#777;font-size:11px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:15px 14px calc(16px + env(safe-area-inset-bottom))}.sheet h2{font-size:18px;margin:0 0 10px}.line{display:flex;gap:7px;margin:7px 0}.line>*{flex:1;min-width:0}.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.small{min-height:28px;padding:0 8px;font-size:11px}.stat{border:1px solid #eee;border-radius:10px;padding:9px;margin:6px 0;background:#fafafa}.progress{height:9px;background:#e9e9ed;border-radius:99px;overflow:hidden;margin:7px 0}.progress i{display:block;height:100%;background:#111}.check{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.grow{flex:1}.badge{display:inline-block;padding:2px 6px;border-radius:999px;background:#eee;font-size:10px;color:#666}.ok{color:#2e8b57}.warn{color:#b06a00}.search{width:100%;margin-bottom:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dangerbox{background:#f8d7da;padding:9px;border-radius:9px}.successbox{background:#d1e7dd;padding:9px;border-radius:9px}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><h1>🛒 SPESA — BUDGET</h1><button class="gray" id="settings">⚙️</button></div><div class="sub">Prezzo → +. Tutto il resto si aggiorna automaticamente.</div></header>

<div class="card top"><label>💰 Budget</label><input id="budget" type="number" inputmode="decimal" step=".01"><button id="setBudget">Imposta</button><button class="gray new" id="new">↻ Nuova</button></div>
<div class="summary"><div class="metric"><small>Budget</small><b id="bTot"></b></div><div class="metric"><small>Speso</small><b id="sTot"></b></div><div class="metric"><small>Rimasto</small><b id="rTot"></b></div><div class="metric"><small>Stato</small><b id="status"></b></div></div>

<div class="grid">
<button class="gray" id="listBtn">📝 Lista</button><button class="gray" id="productsBtn">🏷️ Prodotti</button><button class="gray" id="pantryBtn">📦 Dispensa</button>
<button class="gray" id="marketsBtn">🏪 Supermercati</button><button class="gray" id="statsBtn">📊 Statistiche</button><button class="gray" id="historyBtn">📋 Storico</button>
<button class="gray" id="searchBtn">🔎 Ricerca</button><button class="gray" id="catsBtn">🗂️ Categorie</button><button class="gray" id="backupBtn">💾 Backup</button>
</div>

<div class="list" id="main"></div>
<div class="card footer"><span>Budget categorie: <b id="catBudget"></b></span><button class="gray" id="budgetCats">⚙️ Budget</button></div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const KEY="spesaBudgetData", AUTO="spesaBudgetData.autoBackup", VERSION=4;
const DEFAULTS=[
["🛒 SPESA ALIMENTARE","🍝 Pasta, riso, cereali e farine",10,"Pasta · Riso · Cereali · Farina"],
["🛒 SPESA ALIMENTARE","🥫 Conserve e legumi",10,"Passata · Pelati · Concentrato · Sughi · Ceci · Fagioli · Lenticchie · Piselli · Olive · Mais"],
["🛒 SPESA ALIMENTARE","🥩 Carne",18,"Pollo · Manzo · Macinato · Salsiccia · Carne fresca"],
["🛒 SPESA ALIMENTARE","🐟 Pesce",12,"Pesce fresco · Salmone · Merluzzo · Frutti di mare"],
["🛒 SPESA ALIMENTARE","🥛 Latte, yogurt e formaggi",20,"Latte · Yogurt · Mozzarella · Formaggi · Panna"],
["🛒 SPESA ALIMENTARE","🥦 Verdura",15,"Melanzane · Zucchine · Patate · Carote · Insalata"],
["🛒 SPESA ALIMENTARE","🍎 Frutta",10,"Mele · Banane · Arance · Pere · Uva"],
["🛒 SPESA ALIMENTARE","🍞 Pane e prodotti da forno",8,"Pane · Focaccia · Piadine · Panini · Prodotti da forno"],
["🛒 SPESA ALIMENTARE","☕ Colazione",8,"Zucchero · Biscotti · Cereali · Marmellata · Cacao"],
["🛒 SPESA ALIMENTARE","🍪 Snack e dolci",7,"Patatine · Crackers · Cioccolato · Merendine · Dolci"],
["🛒 SPESA ALIMENTARE","🥤 Bevande",5,"Acqua · Succhi · Bibite · Tè freddo"],
["🛒 SPESA ALIMENTARE","☕ Caffè e tè",4,"Caffè · Tè · Camomilla · Tisane"],
["🛒 SPESA ALIMENTARE","🫒 Olio, condimenti e spezie",6,"Olio · Aceto · Sale · Pepe · Spezie · Maionese · Ketchup · Salse"],
["🛒 SPESA ALIMENTARE","🧊 Surgelati",2,"Verdure surgelate · Patatine · Pesce surgelato · Gelati"],
["🛒 SPESA ALIMENTARE","❄️ Frigorifero",5,"Insalata · Pasta fresca · Salumi · Pancetta affumicata · Burro · Dadi · Würstel · Pomodori · Zucca · Olive"],
["🐱 GATTI","🥣 Croccantini",12,""],["🐱 GATTI","🪣 Lettiera",13,""],
["🏠 CASA & PULIZIA","🏠 Casa",15,"Detersivo per pavimenti · Carta igienica · Buste per l’immondizia"],
["🏠 CASA & PULIZIA","🍽️ Tavola",10,"Scottex · Piatti di plastica · Bicchieri · Detersivo per i piatti · Spugne"],
["🏠 CASA & PULIZIA","👕 Lavatrice",10,"Detersivo · Ammorbidente"]
];
const $=id=>document.getElementById(id), money=n=>Math.round(Number(n||0)*100)/100;
const euro=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);

function fresh(){return {schemaVersion:VERSION,budget:200,cats:DEFAULTS.map(x=>({section:x[0],name:x[1],budget:x[2],note:x[3],items:[]})),history:[],shoppingList:[],products:[],sessions:[],supermarkets:[],pantry:[],settings:{currency:"EUR"}}}
function migrate(x){
  if(!x||!Array.isArray(x.cats))return fresh();
  x.budget=Number(x.budget??200); x.history=Array.isArray(x.history)?x.history:[]; x.shoppingList=Array.isArray(x.shoppingList)?x.shoppingList:[];
  x.products=Array.isArray(x.products)?x.products:[];x.sessions=Array.isArray(x.sessions)?x.sessions:[];x.supermarkets=Array.isArray(x.supermarkets)?x.supermarkets:[];x.pantry=Array.isArray(x.pantry)?x.pantry:[];x.settings=x.settings||{currency:"EUR"};
  x.cats.forEach(c=>{c.items=Array.isArray(c.items)?c.items.map(v=>typeof v==="number"?{id:id(),price:v,qty:1,name:""}:{...v,id:v.id||id(),qty:Number(v.qty||1),price:Number(v.price||0)}):[];});
  x.history.forEach(h=>{if(!h.id)h.id=id()});
  x.products.forEach(p=>{p.priceHistory=Array.isArray(p.priceHistory)?p.priceHistory:[]});
  x.schemaVersion=VERSION; return x;
}
function load(){
  let raw=localStorage.getItem(KEY);
  if(!raw){for(const k of ["spesaV6","spesaV5"]){raw=localStorage.getItem(k);if(raw){try{localStorage.setItem(AUTO,JSON.stringify({date:new Date().toISOString(),source:k,data:JSON.parse(raw)}))}catch(e){};break}}}
  let x;try{x=raw?JSON.parse(raw):fresh()}catch(e){x=fresh()}
  x=migrate(x);try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){} return x;
}
let data=load(), pendingNames={};

function save(){data.schemaVersion=VERSION;localStorage.setItem(KEY,JSON.stringify(data))}
function catSum(c){return c.items.reduce((a,x)=>a+money(x.price)*Number(x.qty||1),0)}
function spent(){return data.cats.reduce((a,c)=>a+catSum(c),0)}
function historyFor(item){return data.history.find(h=>h.id===item.id)}
function pantryFind(name){return data.pantry.find(x=>x.name.trim().toLowerCase()===String(name||"").trim().toLowerCase())}
function pantryAdjust(name,delta){const p=pantryFind(name);if(p)p.qty=Math.max(0,Number(p.qty||0)+Number(delta||0))}
function preview(i){
  const p=parseFloat(String($("p"+i)?.value||"").replace(",",".")),q=Math.max(1,parseInt($("q"+i)?.value||1,10)||1);
  const pending=Number.isFinite(p)&&p>0?money(p*q):0;
  const s=spent()+pending,r=data.budget-s;
  $("sTot").textContent=euro(s);$("rTot").textContent=euro(r);$("rTot").className=r<0?"red":"green";$("status").textContent=r<0?"Superato":"OK";$("status").className=r<0?"red":"green";
}
function render(){
  $("budget").value=data.budget;$("bTot").textContent=euro(data.budget);$("sTot").textContent=euro(spent());const r=data.budget-spent();$("rTot").textContent=euro(r);$("rTot").className=r<0?"red":"green";$("status").textContent=r<0?"Superato":"OK";$("status").className=r<0?"red":"green";
  $("catBudget").textContent=euro(data.cats.reduce((a,c)=>a+Number(c.budget||0),0));
  let out="",lastSection="";
  data.cats.forEach((c,i)=>{
    if(c.section!==lastSection){out+=`<div class="section-head">${esc(c.section)}</div>`;lastSection=c.section}
    const s=catSum(c),rem=Number(c.budget||0)-s;
    out+=`<div class="row"><div class="rowtop"><div class="name">${esc(c.name)}${c.note?`<div class="note">${esc(c.note)}</div>`:""}</div><div class="nums">B. ${euro(c.budget)} · S. ${euro(s)} · <span class="${rem<0?"red":""}">R. ${euro(rem)}</span></div></div>
    <div class="entry"><input class="qty" id="q${i}" type="number" min="1" step="1" inputmode="numeric" value="1"><input class="price" id="p${i}" type="number" min="0" step=".01" inputmode="decimal" placeholder="Prezzo unitario €"><button class="gray" data-name="${i}">Nome</button><button class="plus" data-add="${i}">+</button></div>
    ${rem<0?`<div class="alert">⚠️ Superato di ${euro(-rem)}</div>`:""}
    ${c.items.length?`<div class="hist">${c.items.slice(-4).map((x,j)=>`<button class="gray small" data-edit="${i},${c.items.length-1-j}">${x.name?esc(x.name)+" · ":""}${euro(x.price)} × ${x.qty}</button>`).join("")}</div>`:""}</div>`;
  });
  $("main").innerHTML=out;
  data.cats.forEach((c,i)=>{["input","change","keyup"].forEach(ev=>{ $("p"+i).addEventListener(ev,()=>preview(i));$("q"+i).addEventListener(ev,()=>preview(i));})});
}
function add(i){
  const p=parseFloat(String($("p"+i).value||"").replace(",",".")),q=Math.max(1,parseInt($("q"+i).value||1,10)||1);
  if(!Number.isFinite(p)||p<=0){$("p"+i).focus();return}
  const name=pendingNames[i]||"";delete pendingNames[i];const value=money(p),purchase={id:id(),price:value,qty:q,name};
  const market=data.supermarkets.length?(prompt("Supermercato (facoltativo)",data.supermarkets[0]||"")||""):"";
  data.cats[i].items.push(purchase);
  data.history.push({id:purchase.id,date:new Date().toLocaleString("it-IT"),cat:data.cats[i].name,price:value,qty:q,total:money(value*q),product:name,market});
  if(name){
    let prod=data.products.find(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase());
    if(!prod){prod={name,price:value,category:data.cats[i].name,lastMarket:market,priceHistory:[]};data.products.push(prod)}
    prod.price=value;prod.category=data.cats[i].name;prod.lastMarket=market||prod.lastMarket||"";prod.priceHistory.push({date:new Date().toLocaleString("it-IT"),price:value,market,category:data.cats[i].name});
    data.shoppingList.filter(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase()).forEach(x=>{x.done=true;x.purchased=true;x.purchasedPrice=value;x.purchasedAt=new Date().toLocaleString("it-IT")});
    pantryAdjust(name,q);
  }
  save();render();$("p"+i).focus();$("p"+i).select();
}
function editPurchase(i,j){
  const c=data.cats[i],x=c?.items[j];if(!x)return;const h=historyFor(x),oldQ=Number(x.qty||1);
  open(`<h2>✏️ Modifica acquisto</h2><div class="line"><input id="eq" type="number" min="1" value="${oldQ}"><input id="ep" type="number" step=".01" value="${x.price}"></div><button id="saveEdit" style="width:100%">Salva</button><button class="gray" id="delEdit" style="width:100%;margin-top:6px">🗑️ Elimina</button><button class="gray" id="cancel" style="width:100%;margin-top:6px">Annulla</button>`);
  $("cancel").onclick=close;$("delEdit").onclick=()=>{close();deletePurchase(i,j)};
  $("saveEdit").onclick=()=>{const q=Math.max(1,parseInt($("eq").value||1,10)),p=parseFloat(String($("ep").value).replace(",","."));if(!Number.isFinite(p)||p<=0)return;x.price=money(p);x.qty=q;if(x.name)pantryAdjust(x.name,q-oldQ);if(h){h.price=x.price;h.qty=q;h.total=money(p*q)}save();close();render()};
}
function deletePurchase(i,j){
  const c=data.cats[i],x=c?.items[j];if(!x)return;if(!confirm("Eliminare questo acquisto?"))return;
  c.items.splice(j,1);const k=data.history.findIndex(h=>h.id===x.id);if(k>=0)data.history.splice(k,1);if(x.name)pantryAdjust(x.name,-Number(x.qty||1));save();render();
}
function undo(){
  for(let i=data.cats.length-1;i>=0;i--){const c=data.cats[i];if(c.items.length){deletePurchaseNoConfirm(i,c.items.length-1);return}}
}
function deletePurchaseNoConfirm(i,j){const c=data.cats[i],x=c.items[j];c.items.splice(j,1);const k=data.history.findIndex(h=>h.id===x.id);if(k>=0)data.history.splice(k,1);if(x.name)pantryAdjust(x.name,-Number(x.qty||1));save();render()}
function open(html){$("sheet").innerHTML=html;$("modal").classList.add("open")}
function close(){$("modal").classList.remove("open")}
$("modal").onclick=e=>{if(e.target===$("modal"))close()};

function shoppingList(){
  const rows=data.shoppingList.map((x,i)=>`<div class="check"><input type="checkbox" data-check="${i}" ${x.done?"checked":""}><div class="grow ${x.done?"done":""}"><b>${esc(x.name)}</b><div class="muted">${x.price?euro(x.price):"Prezzo da inserire"}${x.qty?` · ${x.qty}×`:""}</div></div><button class="gray small" data-listdel="${i}">×</button></div>`).join("")||"<p>Lista vuota.</p>";
  open(`<h2>📝 Lista della spesa</h2><div class="line"><input id="ln" placeholder="Prodotto"><input id="lq" type="number" min="1" value="1" style="max-width:80px"></div><button id="addList" style="width:100%">＋ Aggiungi</button><div style="margin-top:8px">${rows}</div><button class="gray" id="close" style="width:100%;margin-top:10px">Chiudi</button>`);
  $("close").onclick=close;$("addList").onclick=()=>{const n=$("ln").value.trim(),q=Math.max(1,parseInt($("lq").value||1,10));if(!n)return;if(!data.shoppingList.some(x=>x.name.toLowerCase()===n.toLowerCase()&&!x.done))data.shoppingList.push({name:n,qty:q,done:false,purchased:false});save();shoppingList()};
  $("sheet").querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{data.shoppingList[Number(el.dataset.check)].done=el.checked;save();shoppingList()});
  $("sheet").querySelectorAll("[data-listdel]").forEach(el=>el.onclick=()=>{data.shoppingList.splice(Number(el.dataset.listdel),1);save();shoppingList()});
}
function pantryStatus(x){const q=Number(x.qty||0),m=Number(x.min||0);return q<=0?["Finito","red"]:m>0&&q<=m?["Quasi finito","warn"]:["Disponibile","ok"]}
function pantry(){
  const rows=data.pantry.map((x,i)=>{const s=pantryStatus(x);return `<div class="item"><div class="grow"><b>${esc(x.name)}</b><div class="muted">Quantità: <b>${x.qty}</b> · soglia: ${x.min} · <span class="${s[1]}">${s[0]}</span></div></div><div class="actions"><button class="gray small" data-pm="${i}">−</button><button class="gray small" data-pp="${i}">+</button><button class="gray small" data-pe="${i}">✏️</button><button class="gray small" data-pl="${i}">Lista</button><button class="gray small" data-pd="${i}">×</button></div></div>`}).join("")||"<p>Dispensa vuota.</p>";
  open(`<h2>📦 Dispensa</h2><p class="muted">Qui indichi ciò che possiedi realmente. Gli acquisti aumentano la quantità; − simula il consumo. La lista non modifica la dispensa.</p><button id="pa" style="width:100%">＋ Aggiungi prodotto</button>${rows}<button class="gray" id="close" style="width:100%;margin-top:10px">Chiudi</button>`);
  $("close").onclick=close;$("pa").onclick=()=>{const n=prompt("Prodotto");if(!n?.trim())return;const q=Math.max(0,Number(String(prompt("Quantità","1")).replace(",","."))||0),m=Math.max(0,Number(String(prompt("Soglia minima","1")).replace(",","."))||0);const p=pantryFind(n);if(p){p.qty=q;p.min=m}else data.pantry.push({name:n.trim(),qty:q,min:m});save();pantry()};
  $("sheet").querySelectorAll("[data-pm]").forEach(e=>e.onclick=()=>{data.pantry[+e.dataset.pm].qty=Math.max(0,Number(data.pantry[+e.dataset.pm].qty||0)-1);save();pantry()});
  $("sheet").querySelectorAll("[data-pp]").forEach(e=>e.onclick=()=>{data.pantry[+e.dataset.pp].qty=Number(data.pantry[+e.dataset.pp].qty||0)+1;save();pantry()});
  $("sheet").querySelectorAll("[data-pe]").forEach(e=>e.onclick=()=>{const p=data.pantry[+e.dataset.pe],q=Number(String(prompt("Quantità",p.qty)).replace(",",".")),m=Number(String(prompt("Soglia",p.min)).replace(",","."));if(Number.isFinite(q))p.qty=Math.max(0,q);if(Number.isFinite(m))p.min=Math.max(0,m);save();pantry()});
  $("sheet").querySelectorAll("[data-pl]").forEach(e=>e.onclick=()=>{const p=data.pantry[+e.dataset.pl];if(!data.shoppingList.some(x=>x.name.toLowerCase()===p.name.toLowerCase()&&!x.done))data.shoppingList.push({name:p.name,qty:1,done:false,purchased:false});save();pantry()});
  $("sheet").querySelectorAll("[data-pd]").forEach(e=>e.onclick=()=>{data.pantry.splice(+e.dataset.pd,1);save();pantry()});
}
function markets(){
  const rows=data.supermarkets.map((m,i)=>`<div class="item"><span>🏪 ${esc(m)}</span><button class="gray small" data-md="${i}">×</button></div>`).join("")||"<p>Nessun supermercato.</p>";
  open(`<h2>🏪 Supermercati</h2><div class="line"><input id="mn" placeholder="Nome supermercato"><button id="ma">＋ Aggiungi</button></div>${rows}<p class="muted">Durante un acquisto con nome prodotto puoi scegliere il supermercato. I prezzi vengono salvati nello storico del prodotto.</p><button class="gray" id="close" style="width:100%">Chiudi</button>`);
  $("close").onclick=close;$("ma").onclick=()=>{const n=$("mn").value.trim();if(n&&!data.supermarkets.includes(n))data.supermarkets.push(n);save();markets()};$("sheet").querySelectorAll("[data-md]").forEach(e=>e.onclick=()=>{data.supermarkets.splice(+e.dataset.md,1);save();markets()});
}
function products(){
  const rows=data.products.map((p,i)=>{const h=p.priceHistory||[],best=h.length?h.reduce((a,b)=>Number(b.price)<Number(a.price)?b:a,h[0]):null;return `<div class="item"><div class="grow"><b>${esc(p.name)}</b><div class="muted">Ultimo: ${euro(p.price)}${p.lastMarket?" · "+esc(p.lastMarket):""}${best?" · Migliore: "+euro(best.price)+" ("+esc(best.market||"non specificato")+")":""}</div></div><div class="actions"><button class="gray small" data-use="${i}">Usa</button><button class="gray small" data-ph="${i}">Storico</button><button class="gray small" data-px="${i}">×</button></div></div>`}).join("")||"<p>Nessun prodotto archiviato.</p>";
  open(`<h2>🏷️ Prodotti</h2><p class="muted">Archivio prezzi e supermercati inseriti da te.</p>${rows}<button class="gray" id="close" style="width:100%;margin-top:10px">Chiudi</button>`);
  $("close").onclick=close;
  $("sheet").querySelectorAll("[data-px]").forEach(e=>e.onclick=()=>{data.products.splice(+e.dataset.px,1);save();products()});
  $("sheet").querySelectorAll("[data-ph]").forEach(e=>{e.onclick=()=>{const p=data.products[+e.dataset.ph],h=p.priceHistory||[];let rows=h.slice().reverse().map(x=>"<div class='item'><span>"+esc(x.date)+"<br><small>"+esc(x.market||"Non specificato")+" · "+esc(x.category||"")+"</small></span><b>"+euro(x.price)+"</b></div>").join("");open("<h2>🏷️ "+esc(p.name)+"</h2>"+(rows||"<p>Nessun prezzo storico.</p>"))}});
  $("sheet").querySelectorAll("[data-use]").forEach(e=>e.onclick=()=>{const p=data.products[+e.dataset.use];open(`<h2>🛒 Usa «${esc(p.name)}»</h2><div class="line"><input id="up" type="number" step=".01" value="${p.price||""}" placeholder="Prezzo"></div><div class="two">${data.cats.map((c,i)=>`<button class="gray small" data-uc="${i}">${esc(c.name)}</button>`).join("")}</div><button class="gray" id="close" style="width:100%;margin-top:10px">Annulla</button>`);$("close").onclick=products;$("sheet").querySelectorAll("[data-uc]").forEach(b=>b.onclick=()=>{const v=parseFloat(String($("up").value).replace(",","."));if(!Number.isFinite(v)||v<=0)return;const market=data.supermarkets.length?(prompt("Supermercato",p.lastMarket||data.supermarkets[0])||""):"";const x={id:id(),name:p.name,price:money(v),qty:1};data.cats[+b.dataset.uc].items.push(x);data.history.push({id:x.id,date:new Date().toLocaleString("it-IT"),cat:data.cats[+b.dataset.uc].name,price:x.price,qty:1,total:x.price,product:p.name,market});p.price=x.price;p.lastMarket=market;p.category=data.cats[+b.dataset.uc].name;p.priceHistory.push({date:new Date().toLocaleString("it-IT"),price:x.price,market,category:p.category});pantryAdjust(p.name,1);data.shoppingList.filter(z=>z.name.toLowerCase()===p.name.toLowerCase()).forEach(z=>{z.done=true;z.purchased=true;z.purchasedPrice=x.price});save();close();render()})});
}
function stats(){
 const total=spent(), count=data.history.filter(x=>Number(x.total)>0).length, avg=count?total/count:0;
 const cats=data.cats.filter(c=>catSum(c)>0).sort((a,b)=>catSum(b)-catSum(a));
 const ms={};data.history.forEach(x=>{const m=x.market||"Non specificato";ms[m]=(ms[m]||0)+Number(x.total||0)});
 open(`<h2>📊 Statistiche</h2><div class="stat"><div>Spesa totale</div><b style="font-size:20px">${euro(total)}</b></div><div class="stat">Movimenti: <b>${count}</b><br>Media movimento: <b>${euro(avg)}</b></div><h3>Categorie</h3>${cats.map(c=>`<div class="item"><span>${esc(c.name)}</span><b>${euro(catSum(c))}</b></div>`).join("")||"<p>Nessun dato.</p>"}<h3>Supermercati</h3>${Object.entries(ms).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="item"><span>${esc(x[0])}</span><b>${euro(x[1])}</b></div>`).join("")||"<p>Nessun dato.</p>"}<button class="gray" id="close" style="width:100%;margin-top:10px">Chiudi</button>`);$("close").onclick=close;
}
function history(){
 const rows=data.history.slice().reverse().map(x=>`<div class="item"><span>${esc(x.product||x.cat)}<br><small>${esc(x.date)}${x.market?" · "+esc(x.market):""}</small></span><b>${euro(x.total)} ${x.qty>1?`<small>(${x.qty}×)</small>`:""}</b></div>`).join("")||"<p>Nessun movimento.</p>";
 open(`<h2>📋 Storico</h2>${rows}<button class="gray" id="close" style="width:100%;margin-top:10px">Chiudi</button>`);$("close").onclick=close;
}
function search(){
  open(`<h2>🔎 Ricerca</h2><input class="search" id="sq" placeholder="Prodotto, categoria o supermercato"><div id="sr"></div><button class="gray" id="close" style="width:100%">Chiudi</button>`);$("close").onclick=close;
  const run=()=>{const q=$("sq").value.toLowerCase().trim(),r=[];data.products.forEach(p=>{if(!q||p.name.toLowerCase().includes(q))r.push("🏷️ "+p.name+" — "+euro(p.price))});data.cats.forEach(c=>{if(!q||c.name.toLowerCase().includes(q))r.push("🗂️ "+c.name)});data.supermarkets.forEach(m=>{if(!q||m.toLowerCase().includes(q))r.push("🏪 "+m)});data.history.slice().reverse().forEach(x=>{const s=(x.product||"")+" "+x.cat+" "+(x.market||"");if(!q||s.toLowerCase().includes(q))r.push("🧾 "+(x.product||x.cat)+" — "+euro(x.total))});$("sr").innerHTML=r.slice(0,100).map(x=>`<div class="item">${esc(x)}</div>`).join("")||"<p>Nessun risultato.</p>"};$("sq").oninput=run;run();setTimeout(()=>$("sq").focus(),50);
}
function categories(){
 const rows=data.cats.map((c,i)=>`<div class="item"><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.section)} · ${euro(c.budget)}</div></div><button class="gray small" data-ce="${i}">✏️</button><button class="gray small" data-cd="${i}">×</button></div>`).join("");
 open(`<h2>🗂️ Categorie</h2>${rows}<button id="addc" style="width:100%;margin-top:8px">＋ Nuova categoria</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);$("close").onclick=close;
 const secs=["🛒 SPESA ALIMENTARE","🐱 GATTI","🏠 CASA & PULIZIA"];
 $("addc").onclick=()=>{const n=prompt("Nome categoria");if(!n?.trim())return;const s=Math.max(1,Math.min(3,parseInt(prompt("Sezione: 1 Spesa, 2 Gatti, 3 Casa","1"),10)||1));const b=Math.max(0,Number(String(prompt("Budget","0")).replace(",","."))||0);data.cats.push({section:secs[s-1],name:n.trim(),budget:money(b),note:"",items:[]});save();categories();render()};
 $("sheet").querySelectorAll("[data-ce]").forEach(e=>e.onclick=()=>{const c=data.cats[+e.dataset.ce],n=prompt("Nome",c.name);if(!n?.trim())return;c.name=n.trim();const b=Number(String(prompt("Budget",c.budget)).replace(",","."));if(Number.isFinite(b)&&b>=0)c.budget=money(b);save();categories();render()});
 $("sheet").querySelectorAll("[data-cd]").forEach(e=>e.onclick=()=>{const i=+e.dataset.cd;if(catSum(data.cats[i])>0){alert("Non puoi eliminare una categoria con spese registrate.");return}if(confirm("Eliminare la categoria?")){data.cats.splice(i,1);save();categories();render()}});
}
function budgetCats(){
 open(`<h2>⚙️ Budget categorie</h2>${data.cats.map((c,i)=>`<div class="line"><span class="grow">${esc(c.name)}</span><input id="cb${i}" type="number" step=".01" value="${c.budget}"></div>`).join("")}<button id="save" style="width:100%">Salva</button><button class="gray" id="close" style="width:100%;margin-top:6px">Annulla</button>`);$("close").onclick=close;$("save").onclick=()=>{data.cats.forEach((c,i)=>{const v=Number(String($("cb"+i).value).replace(",","."));if(Number.isFinite(v)&&v>=0)c.budget=money(v)});save();close();render()};
}
function backup(){
 open(`<h2>💾 Backup</h2><p class="muted">Il backup contiene budget, acquisti, lista, prodotti, prezzi, supermercati, dispensa e storico.</p><button id="export" style="width:100%">⬇️ Esporta backup</button><button class="gray" id="import" style="width:100%;margin-top:6px">⬆️ Importa backup</button><input id="file" type="file" accept=".json,application/json" hidden><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;$("export").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="spesa-budget-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 $("import").onclick=()=>$("file").click();$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=migrate(JSON.parse(r.result));localStorage.setItem(AUTO,JSON.stringify({date:new Date().toISOString(),source:"pre-import",data}));data=x;save();close();render();alert("Backup importato.")}catch(err){alert("Backup non valido.")}};r.readAsText(f)};
}
function settings(){
 open(`<h2>⚙️ Impostazioni</h2><div class="stat"><b>Spesa — Budget</b><div class="muted">Versione ufficiale ${VERSION}. Dati salvati sul dispositivo.</div></div><button id="resetBudget" style="width:100%">↺ Ripristina budget iniziali</button><button class="gray" id="auto" style="width:100%;margin-top:6px">🛟 Ripristina backup automatico</button><button class="danger" id="wipe" style="width:100%;margin-top:6px">🗑️ Elimina tutti i dati</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;$("resetBudget").onclick=()=>{if(confirm("Ripristinare solo i budget iniziali?")){DEFAULTS.forEach(d=>{const c=data.cats.find(x=>x.name===d[1]);if(c)c.budget=d[2]});save();close();render()}};
 $("auto").onclick=()=>{const b=localStorage.getItem(AUTO);if(!b){alert("Nessun backup automatico disponibile.");return}if(confirm("Ripristinare il backup automatico? I dati attuali saranno sostituiti.")){try{data=migrate(JSON.parse(b).data);save();close();render()}catch(e){alert("Backup automatico non valido.")}}};
 $("wipe").onclick=()=>{if(confirm("Eliminare TUTTI i dati dell'app?")){if(confirm("Conferma definitiva: questa operazione cancella acquisti, lista, prodotti, dispensa e storico.")){localStorage.setItem(AUTO,JSON.stringify({date:new Date().toISOString(),source:"pre-delete",data}));data=fresh();save();close();render()}}};
}
function setBudget(){const v=Number(String($("budget").value).replace(",","."));if(Number.isFinite(v)&&v>=0){data.budget=money(v);save();render()}}
$("main").onclick=e=>{const a=e.target.closest("[data-add]"),n=e.target.closest("[data-name]"),ed=e.target.closest("[data-edit]");if(a)add(+a.dataset.add);else if(n){const i=+n.dataset.name,p=prompt("Nome prodotto");if(p?.trim()){pendingNames[i]=p.trim();n.textContent="✓ Nome"}}else if(ed){const [i,j]=ed.dataset.edit.split(",").map(Number);editPurchase(i,j)}};
$("setBudget").onclick=setBudget;$("new").onclick=()=>{if(confirm("Azzerare solo gli importi della spesa corrente?")){data.cats.forEach(c=>c.items=[]);data.history=[];pendingNames={};save();render()}};
$("listBtn").onclick=shoppingList;$("productsBtn").onclick=products;$("pantryBtn").onclick=pantry;$("marketsBtn").onclick=markets;$("statsBtn").onclick=stats;$("historyBtn").onclick=history;$("searchBtn").onclick=search;$("catsBtn").onclick=categories;$("budgetCats").onclick=budgetCats;$("backupBtn").onclick=backup;$("settings").onclick=settings;
render();
</script>
</body>
</html>

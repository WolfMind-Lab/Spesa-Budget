 });

function itemTotal(x){const q=Number(x.qty||1),p=money(x.price||0);return money(p*(Number(x.measureQty||0)>0?Number(x.measureQty):1)*q)}
function receiptVatTotal(r){return money((r.items||[]).reduce((sum,x)=>{const rate=Number(x.vatRate||0);return sum+(rate>0?itemTotal(x)*rate/(100+rate):0)},0))}
function vatLabel(r){const known=(r.items||[]).filter(x=>Number(x.vatRate)>0).length;return known?`IVA inclusa stimata (righe con aliquota): ${euro(receiptVatTotal(r))}`:"IVA non specificata per le righe"}
function priceUnitInfo(entry){
 const price=Number(entry.offerPrice||entry.normalPrice||entry.price||0);if(!(price>0))return null;
 const size=Number(entry.packageSize||0),unit=String(entry.packageUnit||"").toLowerCase();
 if(size>0&&["g","kg"].includes(unit))return{value:price/(unit==="g"?size/1000:size),unit:"€/kg"};
 if(size>0&&["ml","l"].includes(unit))return{value:price/(unit==="ml"?size/1000:size),unit:"€/L"};
 return{value:price,unit:"€/confezione"};
}
function productInsight(p){
 const entries=(p.priceHistory||[]).map((h,idx)=>({...h,seq:idx,price:Number(h.offerPrice||h.normalPrice||h.price||0)})).filter(h=>h.price>0);
 const current={market:p.lastMarket||"Prezzo attuale",normalPrice:p.normalPrice,offerPrice:p.offerPrice,price:p.price,packageSize:p.packageSize,packageUnit:p.packageUnit};
 if(Number(current.price||current.normalPrice||current.offerPrice)>0)entries.push(current);
 const comparable=entries.map(e=>({e,unit:priceUnitInfo(e)})).filter(x=>x.unit);
 const groups={};comparable.forEach(x=>(groups[x.unit.unit]??=[]).push(x));
 const unit=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length)[0];
 if(!unit||groups[unit].length<2)return p.qualityRating?`Qualità valutata: ${p.qualityRating}/5 · confronto prezzi ancora limitato`:"Confronto prezzi: servono almeno due rilevazioni comparabili";
 const arr=groups[unit].slice().sort((a,b)=>a.unit.value-b.unit.value),best=arr[0],latest=groups[unit][groups[unit].length-1],saving=money(Math.max(0,latest.unit.value-best.unit.value));
 const bestMarket=best.e.market||"Rilevazione migliore";
 const own=priceUnitInfo(current);
 const alternatives=(data.products||[]).filter(q=>q!==p&&q.category===p.category).map(q=>({p:q,u:priceUnitInfo(q)})).filter(q=>q.u&&own&&q.u.unit===own.unit).sort((a,b)=>a.u.value-b.u.value);
 const alt=alternatives.find(q=>q.u.value<own.value);
 const categoryText=alt?` · Alternativa meno cara nella categoria: ${esc(alt.p.name)} (${euro(alt.u.value)} ${alt.u.unit}, differenza ${euro(own.value-alt.u.value)} ${own.unit})`:"";
 return `Miglior prezzo registrato: ${euro(best.unit.value)} ${unit} (${esc(bestMarket)})${saving>0?` · Risparmio potenziale ${euro(saving)} ${unit}`:" · Prezzo più basso registrato"}${categoryText}${p.qualityRating?` · Qualità/prezzo valutata ${p.qualityRating}/5`:""}`;
}
function compressProductPhoto(file){return new Promise((resolve,reject)=>{if(!file){resolve("");return}if(!file.type.startsWith("image/")){reject(new Error("Seleziona un'immagine."));return}const reader=new FileReader();reader.onerror=()=>reject(new Error("Impossibile leggere la foto."));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("Immagine non valida."));img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*Math.min(scale,.85)));canvas.height=Math.max(1,Math.round(img.height*Math.min(scale,.85)));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.64))};img.src=reader.result};reader.readAsDataURL(file)});}

// Legge sempre prezzo e quantità della riga: prima della correzione questi valori
// venivano ignorati dal pulsante + e dal tasto Invio.
function quickEntry(i){
 const raw=$("p"+i)?.value??"";
 const normalized=String(raw).trim().replace(/\s/g,"").replace(",",".");
 const price=normalized===""?0:Number(normalized);
 const qel=$("q"+i);
 const qtyValue=qel?.value||"1";
 const qty=qtyValue==="custom"?Math.max(1,parseInt(prompt("Quantità personalizzata","11"),10)||11):Math.max(1,parseInt(qtyValue,10)||1);
 return {price:Number.isFinite(price)&&price>0?money(price):0,qty};
}

 $("auto").onclick=()=>{const chosen=data.cats.map((c,i)=>i).filter(i=>$("sel"+i).checked);if(!chosen.length)return;const old=chosen.map(i=>Math.max(0,Number($("bud"+i).value)||0)),sum=old.reduce((a,b)=>a+b,0);chosen.forEach((i,k)=>$("bud"+i).value=(sum?data.budget*old[k]/sum:data.budget/chosen.length).toFixed(2));let total=chosen.reduce((a,i)=>a+Number($("bud"+i).value),0),diff=money(data.budget-total);const last=chosen[chosen.length-1];$("bud"+last).value=(Number($("bud"+last).value)+diff).toFixed(2);refresh()};
 $("saveBud").onclick=()=>{let t=0,chosen=0;data.cats.forEach((c,i)=>{c.selected=$("sel"+i).checked;if(!c.selected)c.budget=0;else{chosen++;const v=Number(String($("bud"+i).value||0).replace(",","."));c.budget=Number.isFinite(v)&&v>=0?money(v):0;t+=c.budget}});t=money(t);if(!chosen){data.categoryBudgetsConfigured=false;data.cats.forEach(c=>{c.budget=0;c.selected=false});save();close();render();return}if(Math.abs(t-data.budget)>.01){alert(`La distribuzione deve essere esattamente ${euro(data.budget)}. Attuale: ${euro(t)}.`);return}data.categoryBudgetsConfigured=true;save();close();render()};
 $("skipBud").onclick=()=>{data.categoryBudgetsConfigured=false;data.cats.forEach(c=>{c.budget=0;c.selected=false});save();close();render()};
 $("cancel").onclick=close;refresh();
}

function setBudget(){
 const raw=$("budget").value.trim();
 const v=Number(String(raw).replace(",","."));
 if(raw===""||!Number.isFinite(v)||v<=0){alert("Inserisci un budget generale maggiore di 0.");return}
 data.budget=money(v);data.budgetConfigured=true;
 save();render();
}

 allCatalog.forEach(x=>{const k=x.name.trim().toLowerCase();if(k&&!seen.has(k)){seen.add(k);unique.push(x)}});

 const renderRows=()=>{

   rowsEl.innerHTML=matches.length?matches.map(({x,i})=>`<div class="check"><input type="checkbox" data-ch="${i}" ${x.done?"checked":""}><div class="grow ${x.done?"done":""}"><b>${esc(x.name)}</b><div class="muted">Quantità: ${x.qty||1}${x.category?` · ${esc(x.category)}`:""}${x.purchasedPrice?` · acquistato a ${euro(x.purchasedPrice)}`:""}</div></div><button class="gray small" data-rm="${i}">×</button></div>`).join(""):data.shoppingList.length?"<p class=\"muted\">Nessun prodotto corrisponde alla ricerca.</p>":"<p>Lista vuota.</p>";
   rowsEl.querySelectorAll("[data-ch]").forEach(e=>e.onchange=()=>{data.shoppingList[+e.dataset.ch].done=e.checked;save();renderRows()});
   rowsEl.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{data.shoppingList.splice(+e.dataset.rm,1);save();renderRows()});
 };
 const renderOptions=()=>{
   const q=input.value.trim().toLowerCase();
   const filtered=unique.filter(x=>!q||x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)).slice(0,150);

function productHistoryView(productIndex){
 const p=data.products[productIndex];if(!p)return products(true);
 const history=Array.isArray(p.priceHistory)?p.priceHistory:[];
 const signature=h=>JSON.stringify([
  String(h.date||"").trim(),String(h.market||"").trim().toLocaleLowerCase("it"),
  money(h.normalPrice||0),money(h.offerPrice||0),money(h.price||0)
 ]);
 const counts={};history.forEach(h=>{const k=signature(h);counts[k]=(counts[k]||0)+1});
 const duplicateCount=Object.values(counts).reduce((n,c)=>n+Math.max(0,c-1),0);
 const rows=history.map((h,i)=>({h,i})).reverse().map(({h,i})=>`<div class="item"><div class="grow"><b>${esc(h.date||"Data non indicata")}</b><div class="muted">${esc(h.category||"")} · ${esc(h.market||"")}</div><div>Orig. ${euro(h.normalPrice||h.price||0)}${h.offerPrice?` · Off. ${euro(h.offerPrice)}`:""}</div></div><div class="actions"><button class="gray small" data-edit-ph="${i}">✏️ Modifica</button><button class="gray small" data-delete-ph="${i}">🗑️</button></div></div>`).join("")||"<p>Nessun prezzo storico.</p>";
 open(`<div class="panelbar"><button class="gray" id="productHistoryBackTop">Indietro</button></div><h2>💶 Storico: ${esc(p.name)}</h2><div class="stat"><b>Prezzo attuale:</b> ${p.normalPrice?euro(p.normalPrice):"—"}${p.offerPrice?` · Offerta ${euro(p.offerPrice)}`:""}<br><b>Registrazioni:</b> ${history.length}<br><b>Possibili duplicati identici:</b> ${duplicateCount}</div><p class="muted">Puoi correggere o eliminare ogni singola osservazione. Le modifiche non toccano gli scontrini salvati.</p><button class="gray" id="cleanHistoryDuplicates" style="width:100%;margin-bottom:10px" ${duplicateCount?"":"disabled"}>🧹 Rimuovi duplicati identici (${duplicateCount})</button>${rows}<button class="gray" id="productHistoryBack" style="width:100%;margin-top:8px">Indietro</button>`);
 $("productHistoryBack").onclick=()=>products(true);$("productHistoryBackTop").onclick=()=>products(true);
 $("sheet").querySelectorAll("[data-edit-ph]").forEach(e=>e.onclick=()=>{
  const i=+e.dataset.editPh,h=history[i];if(!h)return;
  open(`<h2>✏️ Modifica registrazione</h2><label class="muted">Data e ora</label><input id="heDate" value="${esc(h.date||"")}" style="width:100%"><label class="muted">Categoria</label><input id="heCat" value="${esc(h.category||p.category||"")}" style="width:100%"><label class="muted">Supermercato</label><input id="heMarket" value="${esc(h.market||"")}" style="width:100%"><div class="two"><div><label class="muted">Prezzo normale €</label><input id="heNormal" type="number" min="0" step=".01" value="${h.normalPrice??h.price??""}"></div><div><label class="muted">Prezzo offerta €</label><input id="heOffer" type="number" min="0" step=".01" value="${h.offerPrice??""}"></div></div><div class="actions"><button id="heSave" style="width:100%">Salva modifiche</button><button id="heCancel" class="gray" style="width:100%">Annulla</button></div>`);
  $("heCancel").onclick=()=>productHistoryView(productIndex);
  $("heSave").onclick=()=>{const normal=money($("heNormal").value),offer=money($("heOffer").value);if(normal<=0&&offer<=0){alert("Inserisci almeno un prezzo valido.");return}Object.assign(h,{date:$("heDate").value.trim(),category:$("heCat").value.trim(),market:$("heMarket").value.trim(),normalPrice:normal,offerPrice:offer,price:money(offer||normal),isOffer:offer>0});save();productHistoryView(productIndex)};
 });
 $("sheet").querySelectorAll("[data-delete-ph]").forEach(e=>e.onclick=()=>{const i=+e.dataset.deletePh;if(!confirm("Eliminare soltanto questa registrazione dallo storico? Gli scontrini e le altre registrazioni resteranno invariati."))return;history.splice(i,1);p.priceHistory=history;save();productHistoryView(productIndex)});
 $("cleanHistoryDuplicates").onclick=()=>{if(!duplicateCount)return;if(!confirm(`Sono state individuate ${duplicateCount} registrazioni identiche in eccesso. Vuoi conservarne una per gruppo e rimuovere solo le copie esatte?`))return;const seen=new Set();p.priceHistory=history.filter(h=>{const k=signature(h);if(seen.has(k))return false;seen.add(k);return true});save();productHistoryView(productIndex)};
}

  $("sheet").querySelectorAll("[data-stock-plus]").forEach(e=>e.onclick=()=>{const p=data.products[+e.dataset.stockPlus];p.stockQty=Number(p.stockQty||0)+1;save();draw()});
  $('sheet').querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{if(!confirm("Eliminare questo prodotto dal catalogo? Gli scontrini e lo storico già registrati non verranno cancellati."))return;data.products.splice(+e.dataset.del,1);save();draw()});
  $('sheet').querySelectorAll('[data-edit-product]').forEach(e=>e.onclick=()=>{const p=data.products[+e.dataset.editProduct];const oldName=p.name;const name=prompt("Nome prodotto",p.name);if(name===null)return;const cat=prompt("Categoria esatta (scegli tra quelle mostrate nell'app):\n"+data.cats.map(c=>c.name).join("\n"),p.category||"");if(cat===null)return;const target=data.cats.find(c=>c.name===cat.trim());if(!target){alert("Categoria non riconosciuta: nessuna modifica applicata.");return}p.name=name.trim()||p.name;p.category=target.name;(p.priceHistory||[]).forEach(h=>h.category=target.name);data.receipts.forEach(r=>r.items.forEach(it=>{if(String(it.name).toLowerCase()===String(oldName).toLowerCase()){it.name=p.name;it.cat=target.name}}));data.history.forEach(h=>{if(String(h.name).toLowerCase()===String(oldName).toLowerCase()){h.name=p.name;h.category=target.name}});save();draw()});
  if(restorePosition)requestAnimationFrame(()=>{$("sheet").scrollTop=__panelY});

function ensureProductPrice(name, category, normalPrice, offerPrice, market, dateLabel){
 const n=money(normalPrice||0),o=money(offerPrice||0);
 if(!name||n<=0 && o<=0)return null;
 let prod=data.products.find(x=>String(x.name||"").toLowerCase()===String(name).toLowerCase());
 if(!prod){prod={name,category:category||inferCategory(name)||"",price:0,normalPrice:0,offerPrice:0,lastMarket:market||"",priceHistory:[]};data.products.push(prod)}
 prod.category=category||prod.category||inferCategory(name)||"";
 // The original price is always independent from the offer.
 if(n>0) prod.normalPrice=n;
 if(o>0) prod.offerPrice=o;
 else if(n>0 && prod.offerPrice>0 && prod.offerPrice===n) prod.offerPrice=0;
 prod.price=money(prod.normalPrice||prod.offerPrice||prod.price||0);
 if(market)prod.lastMarket=market;
 prod.priceHistory=Array.isArray(prod.priceHistory)?prod.priceHistory:[];
 prod.priceHistory.push({date:dateLabel||new Date().toLocaleString("it-IT"),category:prod.category,market:market||"",normalPrice:n,offerPrice:o,isOffer:o>0,price:money(n||o)});
 return prod;
}

function unitPriceFor(price,size,unit){
 price=Number(price||0);size=Number(size||0);unit=String(unit||"").toLowerCase();
 if(!(price>0)||!(size>0))return null;
 if(unit==="g")return {value:price/(size/1000),unit:"€/kg"};
 if(unit==="kg")return {value:price/size,unit:"€/kg"};
 if(unit==="ml")return {value:price/(size/1000),unit:"€/L"};
 if(unit==="l")return {value:price/size,unit:"€/L"};
 return {value:price/size,unit:"€/pezzo"};
}

function priceComparator(){
 const all=comparatorRows();let mode="cards",filter="",query="";
 const render=()=>{const filtered=all.filter(x=>(!filter||x.o.market===filter)&&(!query||[x.p.name,x.p.brand,x.p.variant,x.p.category,x.o.market].join(" ").toLowerCase().includes(query.toLowerCase())));const grouped=new Map();filtered.forEach(x=>{const key=x.p.id||x.p.name;if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(x)});
 const cards=[...grouped.values()].map(arr=>{arr.sort((a,b)=>(a.unit?.value??Infinity)-(b.unit?.value??Infinity));const best=arr[0],q=best.p.qualityRating||0;return `<div class="item"><div class="grow">${best.p.photo?`<img class="product-thumb" src="${best.p.photo}" alt="">`:""}<b>${esc(best.p.name)}</b><div class="muted">${esc(best.format?.label|| (best.format?`${best.format.size} ${best.format.unit}`:""))} · ${esc([best.p.brand,best.p.variant].filter(Boolean).join(" · "))}</div><b>${euro(best.o.price)}</b> · ${best.unit?`${euro(best.unit.value)} ${best.unit.unit}`:"Unità non confrontabile"}<div class="muted">${esc(best.o.market)} · ${esc(best.o.date)} · Qualità ${q?`${q}/5`:"non valutata"}</div><div class="actions"><button class="gray small" data-compare-detail="${esc(best.p.id||best.p.name)}">Dettagli</button><button class="small" data-basket-add="${esc(best.p.id||best.p.name)}">＋ Lista</button></div></div></div>`}).join("")||"<p>Nessun prezzo trovato con i filtri selezionati.</p>";
 const table=filtered.map(x=>`<tr><td>${esc(x.p.name)}${x.format?`<br><small>${esc(x.format.label||`${x.format.size} ${x.format.unit}`)}</small>`:""}</td><td>${esc(x.o.market)}</td><td>${euro(x.o.price)}</td><td>${x.unit?`${euro(x.unit.value)} ${x.unit.unit}`:"—"}</td><td>${esc(x.o.date)}</td><td>${x.o.qualityRating?x.o.qualityRating+"/5":"—"}</td><td><button class="gray small" data-basket-add="${esc(x.p.id||x.p.name)}">＋</button></td></tr>`).join("");
 open(`<h2>⚖️ Comparatore prezzi</h2><p class="muted">Sono mostrati tutti i prezzi storici con la relativa data. I prezzi storici non sono offerte attuali garantite.</p><input id="cmpSearch" placeholder="Cerca prodotto, marca o categoria" value="${esc(query)}" style="width:100%"><select id="cmpMarket" style="width:100%;margin-top:6px"><option value="">Tutti i supermercati / punti vendita</option>${[...new Set(all.map(x=>x.o.market).filter(Boolean))].map(m=>`<option ${filter===m?"selected":""}>${esc(m)}</option>`).join("")}</select><div class="actions" style="margin-top:8px"><button class="${mode==="cards"?"":"gray"}" id="cmpCards">Schede</button><button class="${mode==="table"?"":"gray"}" id="cmpTable">Tabella</button><button class="gray" id="cmpBasket">Apri lista (${data.smartBasket.length})</button></div>${mode==="cards"?cards:`<div style="overflow:auto"><table><thead><tr><th>Prodotto</th><th>Punto vendita</th><th>Prezzo</th><th>Prezzo unitario</th><th>Data</th><th>Qualità</th><th>Lista</th></tr></thead><tbody>${table}</tbody></table></div>`}<button class="gray" id="cmpClose" style="width:100%;margin-top:8px">Chiudi</button>`);
 $("cmpClose").onclick=close;$("cmpSearch").oninput=e=>{query=e.target.value;render()};$("cmpMarket").onchange=e=>{filter=e.target.value;render()};$("cmpCards").onclick=()=>{mode="cards";render()};$("cmpTable").onclick=()=>{mode="table";render()};$("cmpBasket").onclick=smartBasket;
 $("sheet").querySelectorAll("[data-basket-add]").forEach(b=>b.onclick=()=>{const p=data.products.find(x=>(x.id||x.name)===b.dataset.basketAdd)||data.products.find(x=>x.name===b.dataset.basketAdd);if(!p)return;const old=data.smartBasket.find(x=>x.productId===p.id);if(old)old.qty++;else data.smartBasket.push({id:uid(),productId:p.id||"",name:p.name,qty:1});save();priceComparator()});
 $("sheet").querySelectorAll("[data-compare-detail]").forEach(b=>b.onclick=()=>{const p=data.products.find(x=>(x.id||x.name)===b.dataset.compareDetail)||data.products.find(x=>x.name===b.dataset.compareDetail);if(p)compareProduct(p)});
 };
 render();
}
function sameProductType(a,b){
 const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(t=>t.length>2);
 const aa=new Set(norm(a.name)),bb=new Set(norm(b.name));if(!aa.size||!bb.size)return false;const overlap=[...aa].filter(t=>bb.has(t)).length;const ratio=overlap/Math.max(aa.size,bb.size);return ratio>=0.5;
}
function compareProduct(p){
 const own=comparatorRows().filter(x=>x.p===p);const similar=comparatorRows().filter(x=>x.p!==p&&x.p.category&&p.category&&x.p.category===p.category&&sameProductType(p,x.p));const unit=own.find(x=>x.unit)?.unit?.unit;const equivalents=similar.filter(x=>!unit||x.unit?.unit===unit).sort((a,b)=>(a.unit?.value??Infinity)-(b.unit?.value??Infinity));
 const candidates=[p,...[...new Set(similar.map(x=>x.p))]];const latest=candidates.map(prod=>{const h=(prod.priceHistory||[]).slice(-1)[0];const price=Number(h?.offerPrice||h?.normalPrice||h?.price||prod.offerPrice||prod.normalPrice||prod.price||0);const size=Number(h?.packageSize||prod.packageSize||0);const u=h?.packageUnit||prod.packageUnit||"";return {prod,price,date:h?.date||"Prezzo anagrafica",market:h?.market||prod.lastMarket||"",unit:unitPriceFor(price,size,u),quality:Number(prod.qualityRating||0)}}).filter(x=>x.price>0&&x.unit&&(!unit||x.unit.unit===unit));const min=latest.length?Math.min(...latest.map(x=>x.unit.value)):0;const rated=latest.filter(x=>x.quality>0).map(x=>({...x,score:((min/x.unit.value)*50)+(x.quality/5*50)})).sort((a,b)=>b.score-a.score);const qualityBest=latest.filter(x=>x.quality>0).sort((a,b)=>b.quality-a.quality)[0];const priceBest=latest.slice().sort((a,b)=>a.unit.value-b.unit.value)[0];const overall=rated[0];
 open(`<h2>Confronto: ${esc(p.name)}</h2><div class="stat"><b>Indicatori del confronto</b><div>Più conveniente: ${priceBest?`${esc(priceBest.prod.name)} · ${euro(priceBest.unit.value)} ${priceBest.unit.unit}`:"dati insufficienti"}</div><div>Migliore qualità: ${qualityBest?`${esc(qualityBest.prod.name)} · ${qualityBest.quality}/5`:"nessuna valutazione disponibile"}</div><div>Miglior acquisto equilibrato: ${overall?`${esc(overall.prod.name)} · punteggio ${overall.score.toFixed(0)}/100`:"non calcolabile: servono prezzi unitari e valutazioni qualità"}</div><small class="muted">Punteggio equilibrato: 50% convenienza unitaria e 50% qualità personale. Usa l’ultima rilevazione disponibile per ogni prodotto.</small></div><h3>Stesso prodotto</h3>${own.map(x=>`<div class="item"><span>${euro(x.o.price)} · ${x.unit?`${euro(x.unit.value)} ${x.unit.unit}`:"unità non disponibile"}<br><small>${esc(x.o.market)} · ${esc(x.o.date)}</small></span></div>`).join("")||"<p>Nessun dato.</p>"}<h3>Alternative di categoria</h3><p class="muted">Sono suggerimenti: nessuna alternativa viene sostituita automaticamente.</p>${equivalents.map(x=>`<div class="item"><div class="grow"><b>${esc(x.p.name)}</b><div class="muted">${esc(x.p.brand||"")} · ${esc(x.o.market)} · ${esc(x.o.date)}</div>${euro(x.o.price)} · ${x.unit?`${euro(x.unit.value)} ${x.unit.unit}`:"—"}</div><button class="gray small" data-alt-add="${esc(x.p.id||x.p.name)}">Aggiungi alternativa</button></div>`).join("")||"<p>Nessuna alternativa confrontabile disponibile.</p>"}<button class="gray" id="cmpBack" style="width:100%">Indietro</button>`);$("cmpBack").onclick=priceComparator;$("sheet").querySelectorAll("[data-alt-add]").forEach(b=>b.onclick=()=>{const q=data.products.find(x=>(x.id||x.name)===b.dataset.altAdd)||data.products.find(x=>x.name===b.dataset.altAdd);if(q){const old=data.smartBasket.find(x=>x.productId===q.id);if(old)old.qty++;else data.smartBasket.push({id:uid(),productId:q.id||"",name:q.name,qty:1});save();smartBasket()} });
}
function smartBasket(){
 const rows=data.smartBasket.map((b,i)=>{const p=data.products.find(x=>x.id===b.productId)||data.products.find(x=>x.name===b.name);return `<div class="item"><div class="grow"><b>${esc(b.name)}</b><div class="muted">${p?`Scorta: ${Number(p.stockQty||0)} confezioni · ${p.qualityRating?`qualità ${p.qualityRating}/5`:"qualità non valutata"}`:"Prodotto non più presente in catalogo"}</div></div><input data-bqty="${i}" type="number" min="1" value="${b.qty}" style="width:76px"><button class="danger small" data-bdel="${i}">×</button></div>`}).join("")||"<p>Lista intelligente vuota. Aggiungi prodotti dal comparatore.</p>";
 const allRows=comparatorRows();const markets=[...new Set(allRows.map(x=>x.o.market).filter(Boolean))];const totals=markets.map(m=>{let total=0,found=0,missing=0;data.smartBasket.forEach(b=>{const p=data.products.find(x=>x.id===b.productId)||data.products.find(x=>x.name===b.name);const opts=p?allRows.filter(x=>x.p===p&&x.o.market===m).sort((a,b)=>Number(b.o.seq||0)-Number(a.o.seq||0)):[];if(opts.length){total+=Number(opts[0].o.price)*b.qty;found++}else missing++});return{m,total,found,missing}}).sort((a,b)=>a.total-b.total);let splitTotal=0,splitFound=0,splitMissing=0;const splitLines=data.smartBasket.map(b=>{const p=data.products.find(x=>x.id===b.productId)||data.products.find(x=>x.name===b.name);const opts=p?allRows.filter(x=>x.p===p&&x.o.market).sort((a,b)=>Number(b.o.seq||0)-Number(a.o.seq||0)):[];if(!opts.length){splitMissing++;return {...b,market:"Non disponibile",subtotal:0}}const byMarket=new Map();opts.forEach(o=>{const prev=byMarket.get(o.o.market);if(!prev||Number(o.o.seq||0)>Number(prev.o.seq||0))byMarket.set(o.o.market,o)});const best=[...byMarket.values()].sort((a,b)=>a.o.price-b.o.price)[0];splitFound++;const subtotal=Number(best.o.price)*b.qty;splitTotal+=subtotal;return {...b,market:best.o.market,subtotal}});
 open(`<h2>🛒 Lista della spesa intelligente</h2><p class="muted">Quantità modificabili. I totali usano l'ultima rilevazione disponibile per ciascun punto vendita: possono essere storici, non prezzi garantiti oggi.</p>${rows}<div class="actions"><button class="gray" id="basketAddManual" style="flex:1">＋ Aggiungi prodotto</button><button class="gray" id="basketImportList" style="flex:1">Importa lista esistente</button></div><h3>Confronto carrelli per supermercato</h3>${totals.map(t=>`<div class="stat"><b>${esc(t.m)}</b><div>Totale parziale stimato: <b>${euro(t.total)}</b></div><div class="muted">${t.found} prodotti conteggiati · ${t.missing} senza prezzo disponibile</div></div>`).join("")||"<p>Non ci sono prezzi associati a supermercati.</p>"}<h3>Carrello suddiviso tra supermercati</h3><div class="stat"><b>Totale parziale stimato: ${euro(splitTotal)}</b><div class="muted">${splitFound} prodotti con prezzo · ${splitMissing} senza prezzo disponibile. Non include costi di spostamento.</div>${splitLines.map(x=>`<div>${esc(x.name)} × ${x.qty}: ${esc(x.market)} · ${euro(x.subtotal)}</div>`).join("")}</div><button id="basketClose" class="gray" style="width:100%">Chiudi</button>`);
 $("basketClose").onclick=close;$("basketImportList").onclick=()=>{let added=0;(data.shoppingList||[]).filter(x=>!x.done).forEach(x=>{const p=data.products.find(z=>z.name.toLowerCase()===String(x.name||"").toLowerCase());const id=p?.id||"";const old=data.smartBasket.find(z=>z.productId===id&&z.name.toLowerCase()===String(x.name||"").toLowerCase());if(old)old.qty+=Math.max(1,Number(x.qty||1));else data.smartBasket.push({id:uid(),productId:id,name:x.name,qty:Math.max(1,Number(x.qty||1))});added++});save();smartBasket();if(!added)alert("Non ci sono prodotti non completati nella lista da importare.")};$("basketAddManual").onclick=()=>{const name=prompt("Nome prodotto da aggiungere");if(!name?.trim())return;let p=data.products.find(x=>x.name.toLowerCase()===name.trim().toLowerCase());if(!p){p={id:uid(),name:name.trim(),category:inferCategory(name.trim())||"",priceHistory:[]};data.products.push(p)}data.smartBasket.push({id:uid(),productId:p.id,name:p.name,qty:1});save();smartBasket()};$("sheet").querySelectorAll("[data-bqty]").forEach(e=>e.onchange=()=>{data.smartBasket[+e.dataset.bqty].qty=Math.max(1,Number(e.value)||1);save();smartBasket()});$("sheet").querySelectorAll("[data-bdel]").forEach(e=>e.onclick=()=>{data.smartBasket.splice(+e.dataset.bdel,1);save();smartBasket()});
}

function smartEntry(){
 open(`<h2>✨ Inserimento intelligente</h2><p class="muted">Scrivi prodotto, prezzo, quantità e formato. Esempi: pasta 0,55€ quantità 5 confezione 500 g · peperoni gialli 3,49€/kg peso 0,650 kg · latte da 1 L</p><input id="smartText" class="search" placeholder="Scrivi qui il prodotto e i suoi dati" autocomplete="off"><div id="smartPreview" class="stat">In attesa di testo…</div><label class="muted">Categoria (puoi correggerla)</label><select id="smartCategory" style="width:100%">${data.cats.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("")}</select><button id="smartContinue" style="width:100%;margin-top:10px">Riconosci e continua</button><button class="gray" id="close" style="width:100%;margin-top:6px">Annulla</button>`);
 const parse=()=>{const raw=$("smartText").value.trim();const priceMatch=raw.match(/(\d+[,.]\d{1,2})\s*€/);const qtyMatch=raw.match(/(?:quantita|quantità|qtà|pezzi?)\s*[:=]?\s*(\d+)/i)||raw.match(/x\s*(\d+)/i);const measureMatch=raw.match(/(?:peso|volume)\s*(\d+(?:[,.]\d+)?)\s*(kg|g|ml|l|litri?|chili?)/i);const packMatch=measureMatch?null:raw.match(/(?:confezione|formato|da)\s*(\d+(?:[,.]\d+)?)\s*(g|grammi?|kg|chili?|ml|l|litri?)/i)||raw.match(/\b(\d+(?:[,.]\d+)?)\s*(grammi?|kg|chili?|ml|litri?)\b/i);const normUnit=u=>/gramm|^g$/i.test(u||"")?"g":/chili|^kg$/i.test(u||"")?"kg":/ml/i.test(u||"")?"ml":/litri|^l$/i.test(u||"")?"L":"";let qty=qtyMatch?Number(qtyMatch[1]):1;let name=raw.replace(/\d+[,.]?\d*\s*€\s*\/\s*(?:kg|g|l|ml)/ig," ").replace(/\d+[,.]?\d*\s*€/g," ").replace(/(?:quantita|quantità|qtà|pezzi?)\s*[:=]?\s*\d+/ig," ").replace(/x\s*\d+/ig," ").replace(/(?:peso|volume)\s*\d+(?:[,.]\d+)?\s*(?:kg|g|ml|l|litri?|chili?)/ig," ").replace(/(?:confezione|formato|da)\s*\d+(?:[,.]\d+)?\s*(?:grammi?|g|kg|chili?|ml|l|litri?)/ig," ").replace(/\b\d+(?:[,.]\d+)?\s*(?:grammi?|kg|chili?|ml|litri?)\b/ig," ").replace(/\s+/g," ").trim();return{name,price:priceMatch?Number(priceMatch[1].replace(",",".")):0,qty:Math.max(1,qty||1),packageSize:packMatch?Number(packMatch[1].replace(",",".")):0,packageUnit:packMatch?normUnit(packMatch[2]):"",measureQty:measureMatch?Number(measureMatch[1].replace(",",".")):0,measureUnit:measureMatch?normUnit(measureMatch[2]):"",category:inferCategory(name)}};
 const update=()=>{const x=parse();$("smartPreview").innerHTML=x.name?`Prodotto: <b>${esc(x.name)}</b><br>Categoria riconosciuta: <b>${esc(x.category||"Da assegnare — scegli qui sotto")}</b><br>Prezzo: ${x.price?euro(x.price):"Da inserire"}${x.measureUnit?` / ${esc(x.measureUnit)}`:""}<br>Quantità: ${x.qty}${x.measureQty?`<br>Peso/volume effettivo: ${x.measureQty} ${esc(x.measureUnit)}`:""}${x.packageSize?`<br>Formato confezione: ${x.packageSize} ${esc(x.packageUnit)}`:""}`:"Scrivi prodotto, prezzo e quantità.";const c=data.cats.find(z=>z.name===x.category);if(c)$("smartCategory").value=c.name};
 $("smartText").oninput=update;$("smartContinue").onclick=()=>{const x=parse();if(!x.name){alert("Scrivi il nome del prodotto.");return}const c=data.cats.find(z=>z.name===$("smartCategory").value)||data.cats[0];close();openPurchase(data.cats.indexOf(c),{name:x.name,price:x.price,qty:x.qty,packageSize:x.packageSize,packageUnit:x.packageUnit,measureQty:x.measureQty,measureUnit:x.measureUnit,overrideCategory:true})};$("close").onclick=close;update();
}

function settings(){
 open(`<h2>⚙️ Impostazioni</h2><div class="stat"><b>Spesa — Budget V8.9</b><div class="muted">I budget non sono preimpostati. Li scegli tu quando vuoi.</div></div><button id="reset" style="width:100%">↺ Azzera budget e categorie</button><button class="danger" id="wipe" style="width:100%;margin-top:6px">🗑️ Elimina tutti i dati</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;
 $("reset").onclick=()=>{if(confirm("Azzera il budget generale e tutti i budget delle categorie? Gli scontrini e i prodotti NON verranno cancellati.")){data.budget=0;data.budgetConfigured=false;data.categoryBudgetsConfigured=false;data.cats.forEach(c=>{c.budget=0;c.selected=false});save();close();render()}};
 $("wipe").onclick=()=>{if(confirm("Eliminare tutti i dati?")){data=fresh();save();close();render()}};
}

$("main").onclick=e=>{const a=e.target.closest("[data-add]"),n=e.target.closest("[data-name]"),ed=e.target.closest("[data-edit]");if(a||n){const i=+(a?.dataset.add??n.dataset.name);openPurchase(i,quickEntry(i))}else if(ed){const [i,j]=ed.dataset.edit.split(",").map(Number);editPurchase(i,j)}};
$("setBudget").onclick=setBudget;$("budgetCats").onclick=budgetCats;$("budgetCats2").onclick=budgetCats;$("settings").onclick=settings;$("finish").onclick=finishShopping;$("new").onclick=newShopping;
$("listBtn").onclick=list;$("productsBtn").onclick=products;$("laundryBtn").onclick=laundryHub;$("compareBtn").onclick=priceComparator;$("basketBtn").onclick=smartBasket;$("priceCatalogBtn").onclick=priceCatalog;$("pantryBtn").onclick=pantry;$("statsBtn").onclick=stats;$("historyBtn").onclick=history;$("marketBtn").onclick=supermarkets;$("searchBtn").onclick=search;$("catsBtn").onclick=cats;$("backupBtn").onclick=backup;
$("smartBtn").onclick=smartEntry;

// Apri le foto prodotto a schermo intero: vale per catalogo, lista, scontrino e anteprime.
const photoLightbox=$("photoLightbox"),photoLightboxImg=photoLightbox.querySelector("img"),photoCaption=photoLightbox.querySelector(".photo-caption");
function closePhotoLightbox(){photoLightbox.classList.remove("open");photoLightboxImg.classList.remove("zoomed");photoLightboxImg.removeAttribute("src");}
document.addEventListener("click",e=>{
 const thumb=e.target.closest(".product-thumb,.photo-preview img");
 if(thumb){
  e.preventDefault();e.stopPropagation();
  const src=thumb.currentSrc||thumb.src;if(!src)return;
  const item=thumb.closest(".item,.row,.stat");
  const title=item?.querySelector("b,.name")?.textContent?.trim()||thumb.alt||"Foto prodotto";
  photoCaption.textContent=title;photoLightboxImg.src=src;photoLightbox.classList.add("open");return;
 }
 if(e.target===photoLightbox||e.target===photoLightbox.querySelector(".photo-close"))closePhotoLightbox();
});
photoLightboxImg.addEventListener("click",()=>photoLightboxImg.classList.toggle("zoomed"));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&photoLightbox.classList.contains("open"))closePhotoLightbox()});
render();
</script>
</body>

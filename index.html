<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa">
<title>Spesa — Budget</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;padding:calc(8px + env(safe-area-inset-top)) 10px calc(15px + env(safe-area-inset-bottom))}
.app{max-width:620px;margin:auto}header{padding:5px 4px 9px}
h1{font-size:22px;letter-spacing:-.4px;margin:0 0 2px}.subtitle{font-size:12px;color:#777;margin:0}
.card{background:#fff;border-radius:13px;padding:9px 10px;margin-bottom:8px}
.top{display:flex;align-items:center;gap:6px}.top label{font-size:12px;color:#666;font-weight:700}.top input{width:76px;height:34px;border:1px solid #d7d7dc;border-radius:9px;padding:5px 8px;font-size:16px}
button{border:0;background:#111;color:#fff;border-radius:9px;height:34px;padding:0 11px;font-weight:700;font-size:13px;touch-action:manipulation}.gray{background:#e9e9ee;color:#222}.top .new{margin-left:auto}
.summary{display:flex;background:#fff;border-radius:13px;padding:10px 5px;margin-bottom:8px}.metric{flex:1;text-align:center;border-right:1px solid #eee}.metric:last-child{border:0}.metric small{display:block;color:#777;font-size:10px}.metric b{display:block;font-size:16px;margin-top:1px}.green{color:#16823b}.red{color:#c62828}
.list{background:#fff;border-radius:13px;overflow:hidden}.row{padding:9px 10px;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.rowtop{display:flex;align-items:center;gap:5px}.name{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.numbers{font-size:10px;color:#666;white-space:nowrap}.numbers strong{color:#111}.over{color:#c62828!important}
.entry{display:flex;gap:6px;margin-top:6px}.price{flex:1;min-width:0;height:38px;border:1px solid #d8d8dd;border-radius:9px;padding:5px 9px;font-size:17px;-webkit-appearance:none}.plus{width:46px;height:38px;padding:0;font-size:20px}
.hist{font-size:10px;color:#888;margin-top:4px;white-space:nowrap;overflow-x:auto}.hist button{height:20px;padding:0 6px;font-size:10px;background:#eee;color:#333;margin-left:2px}
.alert{font-size:10px;color:#b42318;background:#fff1f1;border-radius:7px;padding:4px 6px;margin-top:5px;display:inline-block}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;min-width:0}.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.footer span{color:#777;font-weight:500}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 10px}.sheet .line{display:flex;gap:7px;margin-bottom:7px}.sheet input{flex:1;border:1px solid #ddd;border-radius:9px;padding:9px;font-size:16px}.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header><h1>🛒 SPESA — BUDGET</h1><p class="subtitle">Inserisci il prezzo e premi +. Il calcolo si aggiorna subito.</p></header>

<div class="card top">
<label>💰 Budget</label><input id="budgetInput" type="number" inputmode="decimal" step="0.01">
<button id="setBudgetBtn">Imposta</button><button class="gray new" id="newShopBtn">↻ Nuova</button>
</div>

<div class="summary">
<div class="metric"><small>Budget</small><b id="budgetTotal"></b></div>
<div class="metric"><small>Speso</small><b id="spentTotal"></b></div>
<div class="metric"><small>Rimasto</small><b id="remainingTotal"></b></div>
<div class="metric"><small>Stato</small><b id="statusTotal"></b></div>
</div>

<div class="card actions">
<button class="gray" id="historyBtn">📋 Storico</button>
<button class="gray" id="undoBtn">↩️ Annulla</button>
<button class="gray" id="editBtn">⚙️ Categorie</button>
</div>

<div class="list" id="list"></div>
<div class="card footer"><div><span>Budget categorie:</span> <b id="categoryBudgetTotal"></b></div><button class="gray" id="resetBtn">Azzera</button></div>
</div>

<div class="modal" id="modal"><div class="sheet"><div id="sheetContent"></div></div></div>

<script>
(function(){
"use strict";
const DEFAULTS=[["🍝 Pasta, riso, farine",20],["🥫 Conserve e legumi",15],["🥩 Carne, pesce, uova",45],["🥛 Latte, yogurt, formaggi",25],["🥦 Verdura",25],["🍎 Frutta",20],["🍞 Pane",10],["☕ Colazione/snack",15],["🫒 Olio, sale, condimenti",10],["💰 Riserva",15]];
const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n);
const money=v=>Math.round(v*100)/100;
let data=load();

function fresh(){return {budget:200,cats:DEFAULTS.map(x=>({name:x[0],budget:x[1],items:[]})),history:[]}}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem("spesaV3"));
  if(x&&Array.isArray(x.cats)) return x;
 }catch(e){}
 return fresh();
}
function save(){localStorage.setItem("spesaV3",JSON.stringify(data))}
function catSum(c){return c.items.reduce((a,v)=>a+Number(v),0)}
function totalSpent(){return data.cats.reduce((a,c)=>a+catSum(c),0)}
function readPrice(i){
 const el=$("price-"+i); if(!el)return NaN;
 const raw=String(el.value).trim().replace(",",".");
 return parseFloat(raw);
}
function updateSummary(pendingCat=-1,pending=0){
 const spent=money(totalSpent()+pending), rem=money(data.budget-spent);
 $("budgetTotal").textContent=euro(data.budget);
 $("spentTotal").textContent=euro(spent);
 $("remainingTotal").textContent=euro(rem);
 $("remainingTotal").className=rem<0?"red":"green";
 $("statusTotal").textContent=rem<0?"Superato":"OK";
 $("statusTotal").className=rem<0?"red":"green";
}
function render(){
 const total=totalSpent(),rem=data.budget-total;
 updateSummary();
 $("budgetInput").value=data.budget;
 $("categoryBudgetTotal").textContent=euro(data.cats.reduce((a,c)=>a+c.budget,0));
 const list=$("list");list.innerHTML="";
 data.cats.forEach((c,i)=>{
  const sp=catSum(c), rm=c.budget-sp;
  const row=document.createElement("div");row.className="row";
  row.innerHTML=
   '<div class="rowtop"><div class="name">'+escapeHtml(c.name)+'</div>'+
   '<div class="numbers">B. '+euro(c.budget)+' · <strong>S. '+euro(sp)+'</strong> · <span class="'+(rm<0?'over':'')+'">R. '+euro(rm)+'</span></div></div>'+
   '<div class="entry"><input class="price" id="price-'+i+'" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Prezzo €">'+
   '<button class="plus" type="button" data-add="'+i+'">+</button></div>'+
   (rm<0?'<div class="alert">⚠️ Superato di '+euro(-rm)+'</div>':'')+
   renderHistory(c,i);
  list.appendChild(row);
  const input=$("price-"+i);
  input.addEventListener("input",()=>preview(i));
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add(i)}});
 });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderHistory(c,i){
 if(!c.items.length)return "";
 return '<div class="hist">'+c.items.map((v,j)=>euro(v)+' <button type="button" data-del="'+i+','+j+'">×</button>').join(" · ")+'</div>';
}
function preview(i){
 const v=readPrice(i);
 if(!Number.isFinite(v)||v<=0){updateSummary();return}
 const c=data.cats[i],shown=money(catSum(c)+v),rm=money(c.budget-shown);
 const row=$("price-"+i).closest(".row");
 row.querySelector(".numbers").innerHTML='B. '+euro(c.budget)+' · <strong>S. '+euro(shown)+'</strong> · <span class="'+(rm<0?'over':'')+'">R. '+euro(rm)+'</span>';
 updateSummary(i,v);
}
function add(i){
 const el=$("price-"+i),v=readPrice(i);
 if(!el||!Number.isFinite(v)||v<=0){el&&el.focus();return false}
 const value=money(v);
 data.cats[i].items.push(value);
 data.history.push({date:new Date().toLocaleString("it-IT"),cat:data.cats[i].name,price:value});
 save();render();
 const next=$("price-"+i);if(next){next.focus();next.select()}
 return true;
}
function del(i,j){
 const c=data.cats[i];if(!c||j<0||j>=c.items.length)return;
 const value=c.items[j];c.items.splice(j,1);
 const k=data.history.findIndex(x=>x.cat===c.name&&Number(x.price)===Number(value));
 if(k>=0)data.history.splice(k,1);
 save();render();
}
function undo(){
 for(let i=data.cats.length-1;i>=0;i--){
  if(data.cats[i].items.length){data.cats[i].items.pop();data.history.pop();save();render();return}
 }
}
function setBudget(){
 const v=parseFloat(String($("budgetInput").value).replace(",","."));
 if(Number.isFinite(v)&&v>=0){data.budget=money(v);save();render()}
}
function newShop(){
 if(confirm("Azzerare i prezzi e iniziare una nuova spesa?")){
  data.cats.forEach(c=>c.items=[]);data.history.push({date:new Date().toLocaleString("it-IT"),cat:"NUOVA SPESA",price:0});
  save();render();
 }
}
function resetAll(){
 if(confirm("Azzera tutto e torna ai budget iniziali?")){data=fresh();save();render()}
}
function closeModal(){$("modal").classList.remove("open")}
function openHistory(){
 const h=data.history.length?data.history.slice().reverse().map(x=>'<div class="history-item"><span>'+escapeHtml(x.cat)+'<br><small>'+x.date+'</small></span><b>'+euro(x.price)+'</b></div>').join(""):"<p>Nessun movimento ancora.</p>";
 $("sheetContent").innerHTML='<h2>📋 Storico</h2>'+h+'<button id="closeModalBtn" style="width:100%;margin-top:12px">Chiudi</button>';
 $("modal").classList.add("open");$("closeModalBtn").onclick=closeModal;
}
function editBudgets(){
 const rows=data.cats.map((c,i)=>'<div class="line"><span style="flex:1;font-size:13px;padding:9px 0">'+escapeHtml(c.name)+'</span><input id="cb-'+i+'" type="number" inputmode="decimal" step=".01" value="'+c.budget+'"></div>').join("");
 $("sheetContent").innerHTML='<h2>⚙️ Budget categorie</h2>'+rows+'<button id="saveCats" style="width:100%;margin-top:6px">Salva budget</button><button class="gray" id="cancelCats" style="width:100%;margin-top:7px">Annulla</button>';
 $("modal").classList.add("open");$("cancelCats").onclick=closeModal;$("saveCats").onclick=saveBudgets;
}
function saveBudgets(){
 data.cats.forEach((c,i)=>{const v=parseFloat(String($("cb-"+i).value).replace(",","."));if(Number.isFinite(v)&&v>=0)c.budget=money(v)});
 save();closeModal();render();
}
$("list").addEventListener("click",e=>{
 const addBtn=e.target.closest("[data-add]");if(addBtn){add(Number(addBtn.dataset.add));return}
 const delBtn=e.target.closest("[data-del]");if(delBtn){const p=delBtn.dataset.del.split(",").map(Number);del(p[0],p[1])}
});
$("setBudgetBtn").onclick=setBudget;
$("newShopBtn").onclick=newShop;
$("historyBtn").onclick=openHistory;
$("undoBtn").onclick=undo;
$("editBtn").onclick=editBudgets;
$("resetBtn").onclick=resetAll;
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
render();
})();
</script>
</body>
</html>

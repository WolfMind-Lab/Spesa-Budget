<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Spesa — Budget</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#111;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;padding:calc(8px + env(safe-area-inset-top)) 10px calc(15px + env(safe-area-inset-bottom))}
.app{max-width:620px;margin:auto}header{padding:5px 4px 9px;position:relative}.headerline{display:flex;align-items:center;gap:8px}.headerline h1{flex:1;margin:0}.settingsBtn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;font-size:20px;padding:0}
h1{font-size:22px;letter-spacing:-.4px;margin:0 0 2px}.subtitle{font-size:12px;color:#777;margin:0}
.card{background:#fff;border-radius:13px;padding:9px 10px;margin-bottom:8px}
.top{display:flex;align-items:center;gap:6px}.top label{font-size:12px;color:#666;font-weight:700}.top input{width:76px;height:34px;border:1px solid #d7d7dc;border-radius:9px;padding:5px 8px;font-size:16px}
button{border:0;background:#111;color:#fff;border-radius:9px;height:34px;padding:0 11px;font-weight:700;font-size:13px;touch-action:manipulation}.gray{background:#e9e9ee;color:#222}.top .new{margin-left:auto}
.summary{display:flex;background:#fff;border-radius:13px;padding:10px 5px;margin-bottom:8px}.metric{flex:1;text-align:center;border-right:1px solid #eee}.metric:last-child{border:0}.metric small{display:block;color:#777;font-size:10px}.metric b{display:block;font-size:16px;margin-top:1px}.green{color:#16823b}.red{color:#c62828}
.list{background:#fff;border-radius:13px;overflow:hidden}.section-head{padding:11px 12px 8px;background:#f2f2f7;border-bottom:1px solid #e7e7eb}.section-title{font-size:15px;font-weight:800;letter-spacing:-.2px}.row{padding:9px 10px;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.rowtop{display:flex;align-items:flex-start;gap:5px}.name{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:normal;overflow:visible}.cat-note{font-size:11px;font-weight:400;color:#8a8a8f;line-height:1.25;margin-top:2px;max-width:100%;white-space:normal;overflow-wrap:anywhere}.numbers{font-size:10px;color:#666;white-space:nowrap}.numbers strong{color:#111}.over{color:#c62828!important}
.entry{display:flex;gap:6px;margin-top:6px}.qty{width:48px;height:38px;border:1px solid #d8d8dd;border-radius:9px;padding:5px 6px;font-size:17px;text-align:center;-webkit-appearance:none}.price{flex:1;min-width:0;height:38px;border:1px solid #d8d8dd;border-radius:9px;padding:5px 9px;font-size:17px;-webkit-appearance:none}.plus{width:46px;height:38px;padding:0;font-size:20px}
.hist{font-size:10px;color:#888;margin-top:4px;white-space:nowrap;overflow-x:auto}.hist button{height:20px;padding:0 6px;font-size:10px;background:#eee;color:#333;margin-left:2px}
.alert{font-size:10px;color:#b42318;background:#fff1f1;border-radius:7px;padding:4px 6px;margin-top:5px;display:inline-block}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;min-width:0}.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.footer span{color:#777;font-weight:500}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.modal.search-open{align-items:flex-start;padding-top:env(safe-area-inset-top)}.modal.search-open .sheet{max-height:calc(100dvh - env(safe-area-inset-top) - 8px);border-radius:0 0 18px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom));overflow:auto}.sheet h2{font-size:18px;margin:0 0 10px}.sheet .line{display:flex;gap:7px;margin-bottom:7px}.sheet input{flex:1;border:1px solid #ddd;border-radius:9px;padding:9px;font-size:16px}.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}

.product-tools{display:flex;gap:7px;margin-bottom:8px}.product-tools button{flex:1}
.checklist{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.checklist:last-child{border-bottom:0}.checklist input{width:20px;height:20px}.pname{flex:1;font-size:14px}
.pprice{font-size:12px;color:#666}.done{text-decoration:line-through;color:#999}
.product-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid #eee}
.product-row:last-child{border-bottom:0}.product-row .pn{flex:1;font-size:13px}.product-row .pp{font-weight:700;font-size:12px}
.smallbtn{height:28px!important;padding:0 8px!important;font-size:11px!important;white-space:nowrap}
.badge{display:inline-block;background:#eee;border-radius:999px;padding:2px 6px;font-size:10px;color:#666}

.v6grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.v6grid button{min-height:38px;font-size:12px}
.v6tabs{display:flex;gap:6px;overflow:auto;margin:8px 0;padding-bottom:2px}
.v6tabs button{white-space:nowrap;font-size:11px;padding:7px 10px}
.formrow{display:flex;gap:6px;margin:7px 0}.formrow input,.formrow select{flex:1;min-width:0}
.manage-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #eee}
.manage-row .grow{flex:1}.muted{font-size:11px;color:#777}
.statbox{border:1px solid #eee;border-radius:10px;padding:9px;margin:6px 0;background:#fafafa}
.progress{height:9px;background:#e9e9ed;border-radius:99px;overflow:hidden;margin:7px 0}
.progress>div{height:100%;background:#111;border-radius:99px}
.alertbox{padding:9px;border-radius:10px;background:#fff3cd;margin:7px 0;font-size:12px}
.dangerbox{background:#f8d7da}.successbox{background:#d1e7dd}
.searchbox{width:100%;box-sizing:border-box;margin:7px 0}

</style>
</head>
<body>
<div class="app">
<header><div class="headerline"><h1>🛒 SPESA — BUDGET V6.1</h1><button class="gray settingsBtn" id="settingsBtn" aria-label="Impostazioni">⚙️</button></div><p class="subtitle">Inserisci il prezzo e premi +. Lista e prodotti sono opzionali.</p></header>

<div class="card top">
<label>💰 Budget</label><input id="budgetInput" type="number" inputmode="decimal" step="0.01">
<button id="setBudgetBtn">Imposta</button><button class="gray new" id="newShopBtn">↻ Nuova</button>
</div>

<div class="summary">
<div class="metric"><small>Budget</small><b id="budgetTotal"></b></div>
<div class="metric"><small>Speso</small><b id="spentTotal"></b></div>
<div class="metric"><small>Rimasto</small><b id="remainingTotal"></b></div>
<div class="metric"><small>Stato</small><b id="statusTotal"></b></div>
</div>

<div class="v6grid">
<button class="gray" id="statsBtn">📊 Statistiche</button>
<button class="gray" id="pantryBtn">📦 Dispensa</button>
<button class="gray" id="marketsBtn">🏪 Supermercati</button>
<button class="gray" id="manageCatsBtn">🗂️ Categorie</button>
<button class="gray" id="searchBtn">🔎 Ricerca</button>
<button class="gray" id="backupBtn">💾 Backup</button>
</div>

<div class="card actions">
<button class="gray" id="listBtn">📝 Lista</button><button class="gray" id="productsBtn">🏷️ Prodotti</button><button class="gray" id="historyBtn">📋 Storico</button>
<button class="gray" id="undoBtn">↩️ Annulla</button>
<button class="gray" id="editBtn">⚙️ Categorie</button><button class="gray" id="summaryBtn">🧾 Fine spesa</button>
</div>

<div class="list" id="list"></div>
<div class="card footer"><div><span>Budget categorie:</span> <b id="categoryBudgetTotal"></b></div><button class="gray" id="resetBtn">Azzera</button></div>
</div>

<div class="modal" id="modal"><div class="sheet"><div id="sheetContent"></div></div></div>

<script>
(function(){
"use strict";
const DEFAULTS = [
 ["🛒 SPESA ALIMENTARE","🍝 Pasta, riso, cereali e farine",10],
 ["🛒 SPESA ALIMENTARE","🥫 Conserve e legumi",10],
 ["🛒 SPESA ALIMENTARE","🥩 Carne",18],
 ["🛒 SPESA ALIMENTARE","🐟 Pesce",12],
 ["🛒 SPESA ALIMENTARE","🥛 Latte, yogurt e formaggi",20],
 ["🛒 SPESA ALIMENTARE","🥦 Verdura",15],
 ["🛒 SPESA ALIMENTARE","🍎 Frutta",10],
 ["🛒 SPESA ALIMENTARE","🍞 Pane e prodotti da forno",8],
 ["🛒 SPESA ALIMENTARE","☕ Colazione",8],
 ["🛒 SPESA ALIMENTARE","🍪 Snack e dolci",7],
 ["🛒 SPESA ALIMENTARE","🥤 Bevande",5],
 ["🛒 SPESA ALIMENTARE","☕ Caffè e tè",4],
 ["🛒 SPESA ALIMENTARE","🫒 Olio, condimenti e spezie",6],
 ["🛒 SPESA ALIMENTARE","🧊 Surgelati",2],
 ["🛒 SPESA ALIMENTARE","❄️ Frigorifero",5],
 ["🐱 GATTI","🥣 Croccantini",12],
 ["🐱 GATTI","🪣 Lettiera",13],
 ["🏠 CASA & PULIZIA","🏠 Casa",15],
 ["🏠 CASA & PULIZIA","🍽️ Tavola",10],
 ["🏠 CASA & PULIZIA","👕 Lavatrice",10]
];
const CATEGORY_NOTES = {
 "🍝 Pasta, riso, cereali e farine":"Pasta · Riso · Cereali · Farina",
 "🥫 Conserve e legumi":"Passata · Pelati · Concentrato · Sughi · Ceci · Fagioli · Lenticchie · Piselli · Olive · Mais",
 "🥩 Carne":"Pollo · Manzo · Macinato · Salsiccia · Carne fresca",
 "🐟 Pesce":"Pesce fresco · Salmone · Merluzzo · Frutti di mare",
 "🥛 Latte, yogurt e formaggi":"Latte · Yogurt · Mozzarella · Formaggi · Panna",
 "🥦 Verdura":"Melanzane · Zucchine · Patate · Carote · Insalata",
 "🍎 Frutta":"Mele · Banane · Arance · Pere · Uva",
 "🍞 Pane e prodotti da forno":"Pane · Focaccia · Piadine · Panini · Prodotti da forno",
 "☕ Colazione":"Zucchero · Biscotti · Cereali · Marmellata · Cacao",
 "🍪 Snack e dolci":"Patatine · Crackers · Cioccolato · Merendine · Dolci",
 "🥤 Bevande":"Acqua · Succhi · Bibite · Tè freddo",
 "☕ Caffè e tè":"Caffè · Tè · Camomilla · Tisane",
 "🫒 Olio, condimenti e spezie":"Olio · Aceto · Sale · Pepe · Spezie · Maionese · Ketchup · Salse",
 "🧊 Surgelati":"Verdure surgelate · Patatine · Pesce surgelato · Gelati",
 "❄️ Frigorifero":"Insalata · Pasta fresca · Salumi · Pancetta affumicata · Burro · Dadi · Würstel · Pomodori · Zucca · Olive",
 "🥣 Croccantini":"",
 "🪣 Lettiera":"",
 "🏠 Casa":"Detersivo per pavimenti · Carta igienica · Buste per l’immondizia",
 "🍽️ Tavola":"Scottex · Piatti di plastica · Bicchieri · Detersivo per i piatti · Spugne",
 "👕 Lavatrice":"Detersivo · Ammorbidente"
};
const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n);
const money=v=>Math.round(v*100)/100;
// Archivio dati permanente: le versioni dell'app usano sempre questa stessa chiave.
// Le vecchie chiavi restano leggibili per la migrazione e non vengono cancellate automaticamente.
const KEY="spesaBudgetData";
const LEGACY_KEYS=["spesaV6","spesaV5"];
const AUTO_BACKUP_KEY="spesaBudgetData.autoBackup";
const SCHEMA_VERSION=2;
let data=load(); let pendingNames={};

function fresh(){return {
  schemaVersion:SCHEMA_VERSION,
  budget:200,
  cats:DEFAULTS.map(x=>({section:x[0],name:x[1],budget:x[2],items:[]})),
  history:[],shoppingList:[],products:[],sessions:[],
  supermarkets:[],pantry:[],settings:{currency:"EUR"}
}}
function load(){
 const candidates=[KEY,...LEGACY_KEYS];
 for(const sourceKey of candidates){
  try{
   const raw=localStorage.getItem(sourceKey);
   if(!raw)continue;
   const x=JSON.parse(raw);
   if(x&&Array.isArray(x.cats)){
      // Prima di una migrazione strutturale conserviamo una copia locale di sicurezza.
      if(sourceKey!==KEY || Number(x.schemaVersion||1)!==SCHEMA_VERSION){
        try{localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify({savedAt:new Date().toISOString(),sourceKey,schemaVersion:Number(x.schemaVersion||1),data:x}))}catch(e){}
      }
      x.cats.forEach(c=>{
        c.items=(c.items||[]).map(v=>typeof v==="number"?{price:v,qty:1,name:""}:Object.assign({name:""},v));
        if(!c.section)c.section="🛒 SPESA ALIMENTARE";
      });
      // Migrazione V6: accorpa le vecchie categorie Gatti e Casa & Pulizia nelle nuove categorie semplificate.
      const migrations={
        "🍝 Pasta, riso e cereali":"🍝 Pasta, riso, cereali e farine",
        "🥫 Conserve e legumi":"🥫 Conserve e legumi",
        "🥩 Carne, pesce e uova":"🥩 Carne",
        "🥩 Carne":"🥩 Carne",
        "🐟 Pesce":"🐟 Pesce",
        "🥛 Latte, yogurt e formaggi":"🥛 Latte, yogurt e formaggi",
        "🥦 Verdura":"🥦 Verdura",
        "🍎 Frutta":"🍎 Frutta",
        "🍞 Pane e prodotti da forno":"🍞 Pane e prodotti da forno",
        "☕ Colazione":"☕ Colazione",
        "🍪 Snack e dolci":"🍪 Snack e dolci",
        "🥤 Bevande":"🥤 Bevande",
        "☕ Caffè e tè":"☕ Caffè e tè",
        "🫒 Olio, aceto e condimenti":"🫒 Olio, condimenti e spezie",
        "🧂 Sale, spezie e salse":"🫒 Olio, condimenti e spezie",
        "🧊 Surgelati":"🧊 Surgelati",
        "🐱 Cibo per gatti":"🥣 Croccantini",
        "🧴 Igiene":"🥣 Croccantini",
        "🧸 Accessori e giochi":"🪣 Lettiera",
        "🏥 Cura e salute":"🪣 Lettiera",
        "🏠 Accessori per la casa del gatto":"🪣 Lettiera",
        "💰 Riserva Gatti":"🪣 Lettiera",
        "🧽 Pulizia della casa":"🏠 Casa",
        "🧻 Carta e prodotti assorbenti":"🏠 Casa",
        "🗑️ Rifiuti":"🏠 Casa",
        "🍽️ Pulizia cucina":"🍽️ Tavola",
        "🍽️ Monouso":"🍽️ Tavola",
        "🧹 Accessori per la pulizia":"🏠 Casa",
        "🧴 Prodotti per superfici":"🏠 Casa",
        "👕 Bucato":"👕 Lavatrice",
        "💰 Riserva Casa":"🏠 Casa"
      };
      if(x.cats.some(c=>migrations[c.name])){
        const freshCats=DEFAULTS.map(d=>({section:d[0],name:d[1],budget:d[2],items:[]}));
        x.cats.forEach(c=>{
          const target=migrations[c.name]||c.name;
          const dst=freshCats.find(n=>n.name===target && n.section===c.section) || freshCats.find(n=>n.name===target);
          if(dst){ dst.items.push(...(c.items||[])); }
          else if(!freshCats.some(n=>n.name===c.name && n.section===c.section)){ freshCats.push(c); }
        });
        x.cats=freshCats;
      }
      x.shoppingList=Array.isArray(x.shoppingList)?x.shoppingList:[];
      x.products=Array.isArray(x.products)?x.products:[];
      x.sessions=Array.isArray(x.sessions)?x.sessions:[];
      x.supermarkets=Array.isArray(x.supermarkets)?x.supermarkets:[];
      x.pantry=Array.isArray(x.pantry)?x.pantry:[];
      x.settings=x.settings||{currency:"EUR"};
      x.schemaVersion=SCHEMA_VERSION;
      // La prima lettura da una vecchia versione viene subito promossa all'archivio permanente.
      try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}
      return x;
    }
  }catch(e){}
 }
 const initial=fresh();
 try{localStorage.setItem(KEY,JSON.stringify(initial))}catch(e){}
 return initial;
}
function save(){
 data.schemaVersion=SCHEMA_VERSION;
 try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Impossibile salvare i dati sul dispositivo.")}
}
function catSum(c){return c.items.reduce((a,v)=>a+Number(v.price||0)*Number(v.qty||1),0)}
function totalSpent(){return data.cats.reduce((a,c)=>a+catSum(c),0)}
function readPrice(i){const el=$("price-"+i);if(!el)return NaN;return parseFloat(String(el.value).trim().replace(",","."));}
function readQty(i){const el=$("qty-"+i);if(!el)return 1;const q=parseInt(el.value,10);return Number.isFinite(q)&&q>0?q:1;}
function updateSummary(pendingCat=-1,pending=0){
 const spent=money(totalSpent()+pending), rem=money(data.budget-spent);
 $("budgetTotal").textContent=euro(data.budget);
 $("spentTotal").textContent=euro(spent);
 $("remainingTotal").textContent=euro(rem);
 $("remainingTotal").className=rem<0?"red":"green";
 $("statusTotal").textContent=rem<0?"Superato":"OK";
 $("statusTotal").className=rem<0?"red":"green";
}
function render(){
 const total=totalSpent(),rem=data.budget-total;
 updateSummary();
 $("budgetInput").value=data.budget;
 $("categoryBudgetTotal").textContent=euro(data.cats.reduce((a,c)=>a+c.budget,0));
 const list=$("list");list.innerHTML="";
 const groups=["🛒 SPESA ALIMENTARE","🐱 GATTI","🏠 CASA & PULIZIA"];
 groups.forEach(section=>{
  const cats=data.cats.map((c,i)=>({c,i})).filter(x=>x.c.section===section);
  if(!cats.length)return;
  const sec=document.createElement("div");sec.className="section-head";sec.innerHTML='<div class="section-title">'+escapeHtml(section)+'</div>';
  list.appendChild(sec);
  cats.forEach(({c,i})=>{
  const sp=catSum(c), rm=c.budget-sp;
  const row=document.createElement("div");row.className="row";
  row.innerHTML=
   '<div class="rowtop"><div class="name">'+escapeHtml(c.name)+(CATEGORY_NOTES[c.name]?'<div class="cat-note">'+escapeHtml(CATEGORY_NOTES[c.name])+'</div>':'')+'</div>'+
   '<div class="numbers">B. '+euro(c.budget)+' · <strong>S. '+euro(sp)+'</strong> · <span class="'+(rm<0?'over':'')+'">R. '+euro(rm)+'</span></div></div>'+
   '<div class="entry"><input class="qty" id="qty-'+i+'" type="number" inputmode="numeric" step="1" min="1" value="1" aria-label="Quantità">'+
   '<input class="price" id="price-'+i+'" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Prezzo unitario €">'+
   '<button class="gray smallbtn" type="button" data-productname="'+i+'">Nome</button><button class="plus" type="button" data-add="'+i+'">+</button></div>'+
   (rm<0?'<div class="alert">⚠️ Superato di '+euro(-rm)+'</div>':'')+
   renderHistory(c,i);
  list.appendChild(row);
  const input=$("price-"+i);
  const refreshPending=()=>preview(i);
  input.addEventListener("input",refreshPending);
  input.addEventListener("change",refreshPending);
  input.addEventListener("keyup",refreshPending);
  $("qty-"+i).addEventListener("input",refreshPending);
  $("qty-"+i).addEventListener("change",refreshPending);
  $("qty-"+i).addEventListener("keyup",refreshPending);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add(i)}});
  });
 });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderHistory(c,i){
 if(!c.items.length)return "";
 return '<div class="hist">'+c.items.map((v,j)=>{const q=Number(v.qty||1),t=money(Number(v.price||0)*q);return (v.name?escapeHtml(v.name)+' · ':'')+euro(t)+(q>1?' ('+q+'× '+euro(v.price)+')':'')+' <button type="button" data-edit="'+i+','+j+'">✏️</button><button type="button" data-del="'+i+','+j+'">×</button>';}).join(" · ")+'</div>';
}
function preview(i){
 const c=data.cats[i];
 const row=$("price-"+i)?.closest(".row");
 if(!c||!row)return;
 const v=readPrice(i);
 const q=readQty(i);
 const pending=Number.isFinite(v)&&v>0?money(v*q):0;
 const actual=catSum(c);
 const shown=money(actual+pending);
 const rm=money(c.budget-shown);
 row.querySelector(".numbers").innerHTML='B. '+euro(c.budget)+' · <strong>S. '+euro(shown)+'</strong> · <span class="'+(rm<0?'over':'')+'">R. '+euro(rm)+'</span>';
 updateSummary(i,pending);
}
function add(i){
 const el=$("price-"+i),v=readPrice(i),q=readQty(i);
 if(!el||!Number.isFinite(v)||v<=0){el&&el.focus();return false}
 const value=money(v),item={price:value,qty:q,name:pendingNames[i]||""}; delete pendingNames[i];
 data.cats[i].items.push(item);
 const market=(item.name&&data.supermarkets.length)?(prompt("Supermercato (facoltativo)",data.supermarkets[0]||"")||""):"";
 data.history.push({date:new Date().toLocaleString("it-IT"),cat:data.cats[i].name,price:value,qty:q,total:money(value*q),product:item.name||"",market});
 if(item.name){
  const normalized=item.name.trim().toLowerCase();
  const ex=(data.products||[]).find(p=>p.name.trim().toLowerCase()===normalized);
  if(ex)ex.price=value; else data.products.push({name:item.name,price:value});
  (data.shoppingList||[]).forEach(x=>{
    if(String(x.name||"").trim().toLowerCase()===normalized){
      x.done=true; x.purchased=true; x.purchasedAt=new Date().toLocaleString("it-IT"); x.purchasedPrice=value;
    }
  });
}
 save();render();const next=$("price-"+i);if(next){next.focus();next.select()}return true;
}
function del(i,j){
 const c=data.cats[i];if(!c||j<0||j>=c.items.length)return;
 const item=c.items[j];c.items.splice(j,1);

 data.cats.forEach((c,i)=>{const v=parseFloat(String($("cb-"+i).value).replace(",","."));if(Number.isFinite(v)&&v>=0)c.budget=money(v)});
 save();closeModal();render();
}
$("list").addEventListener("click",e=>{
 const nameBtn=e.target.closest("[data-productname]");if(nameBtn){const i=Number(nameBtn.dataset.productname);const n=prompt("Nome prodotto (facoltativo)");if(n&&n.trim()){pendingNames[i]=n.trim();nameBtn.textContent="✓ Nome"}return}
 const addBtn=e.target.closest("[data-add]");if(addBtn){add(Number(addBtn.dataset.add));return}
 const editBtn=e.target.closest("[data-edit]");if(editBtn){const p=editBtn.dataset.edit.split(",").map(Number);editItem(p[0],p[1]);return}
 const delBtn=e.target.closest("[data-del]");if(delBtn){const p=delBtn.dataset.del.split(",").map(Number);del(p[0],p[1])}
});

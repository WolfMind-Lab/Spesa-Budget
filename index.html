const $=id=>document.getElementById(id);
const money=n=>Math.round(Number(n||0)*100)/100;
const euro=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function fresh(){
 return {schemaVersion:VERSION,budget:0,budgetConfigured:false,categoryBudgetsConfigured:false,cats:DEFAULTS.map(x=>({section:x[0],name:x[1],budget:0,note:x[3],selected:false,items:[]})),history:[],receipts:[],currentReceiptId:null,shoppingList:[],products:[],supermarkets:[],pantry:[]};
}
function migrate(x){
 if(!x||!Array.isArray(x.cats))return fresh();
 const hadBudgetConfigured=typeof x.budgetConfigured === "boolean";
 x.budget=Number(x.budget??0);
 x.budgetConfigured=hadBudgetConfigured?x.budgetConfigured:false;
 x.categoryBudgetsConfigured=typeof x.categoryBudgetsConfigured === "boolean" ? x.categoryBudgetsConfigured : Boolean(x.budgetConfigured && Array.isArray(x.cats) && x.cats.some(c=>c.selected===true && Number(c.budget||0)>0));
 if(!hadBudgetConfigured){x.budget=0;x.budgetConfigured=false;x.categoryBudgetsConfigured=false;}
 // Aggiunge automaticamente le nuove categorie alle installazioni precedenti.
 DEFAULTS.forEach(d=>{
   if(!x.cats.some(c=>c.name===d[1])){
     x.cats.push({section:d[0],name:d[1],budget:0,note:d[3],selected:false,items:[]});
   }
 });
 // Ordine ufficiale delle sezioni: segue il percorso abituale nel supermercato, senza mostrare etichette di corridoio.
 const order=DEFAULTS.map(d=>d[1]);
 const pos=new Map(order.map((name,i)=>[name,i]));
 x.cats.sort((a,b)=>{
   const pa=pos.has(a.name)?pos.get(a.name):order.length;
   const pb=pos.has(b.name)?pos.get(b.name):order.length;
   return pa-pb;
 });
 x.history=Array.isArray(x.history)?x.history:[];
 x.receipts=Array.isArray(x.receipts)?x.receipts:[];
 x.currentReceiptId=x.currentReceiptId||null;
 x.shoppingList=Array.isArray(x.shoppingList)?x.shoppingList:[];
 x.products=Array.isArray(x.products)?x.products:[];
 x.supermarkets=Array.isArray(x.supermarkets)?x.supermarkets:[];
 x.pantry=Array.isArray(x.pantry)?x.pantry:[];
 x.cats.forEach(c=>{
   if(!x.categoryBudgetsConfigured){c.budget=0;c.selected=false;}
   if(c.selected===undefined)c.selected=true;
   if(c.selected===false)c.budget=0;

   const lastWithOffer=[...ph].reverse().find(h=>Number(h.offerPrice||0)>0);
   const distinctNormals=[...ph].reverse().filter(h=>Number(h.normalPrice||0)>0 && Number(h.normalPrice||0)!==Number(h.offerPrice||0));

 x.cats.forEach(c=>c.items.forEach(it=>{
   const prod=x.products.find(p=>String(p.name||"").toLowerCase()===String(it.name||"").toLowerCase());

   if(prod && Number(prod.normalPrice||0)>it.normalPrice) it.normalPrice=Number(prod.normalPrice);

   it.price=Number((it.offerPrice>0?it.offerPrice:it.normalPrice)||it.price||0);

 }));
 // Catalogo 6.8: corregge denominazioni senza cancellare prodotti già salvati dall'utente.
 // "Coton fiocchi" non viene più proposto; il nome standard è "Cotton fioc".
 x.schemaVersion=VERSION;

function ensureProductPrice(name, category, normalPrice, offerPrice, market, dateLabel){
 const n=money(normalPrice||0),o=money(offerPrice||0);
 if(!name||n<=0 && o<=0)return null;
 let prod=data.products.find(x=>String(x.name||"").toLowerCase()===String(name).toLowerCase());
 if(!prod){prod={name,category:category||inferCategory(name)||"",price:0,normalPrice:0,offerPrice:0,lastMarket:market||"",priceHistory:[]};data.products.push(prod)}
 prod.category=category||prod.category||inferCategory(name)||"";
 // The original price is always independent from the offer.
 if(n>0) prod.normalPrice=n;
 if(o>0) prod.offerPrice=o;
 else if(n>0 && prod.offerPrice>0 && prod.offerPrice===n) prod.offerPrice=0;
 prod.price=money(prod.normalPrice||prod.offerPrice||prod.price||0);
 if(market)prod.lastMarket=market;
 prod.priceHistory=Array.isArray(prod.priceHistory)?prod.priceHistory:[];
 prod.priceHistory.push({date:dateLabel||new Date().toLocaleString("it-IT"),category:prod.category,market:market||"",normalPrice:n,offerPrice:o,isOffer:o>0,price:money(n||o)});
 return prod;
}

}

function pantry(){
 const rows=data.pantry.map((p,i)=>`<div class="item"><div class="grow"><b>${esc(p.name)}</b><div class="muted">Quantità: ${p.qty||0} · minimo: ${p.min||0}</div></div><div class="actions"><button class="gray small" data-pm="${i}">−</button><button class="gray small" data-pp="${i}">+</button><button class="gray small" data-pd="${i}">×</button></div></div>`).join("")||"<p>Dispensa vuota.</p>";
 open(`<h2>📦 Dispensa</h2><button id="pa" style="width:100%">＋ Aggiungi prodotto</button>${rows}<button class="gray" id="close" style="width:100%;margin-top:8px">Chiudi</button>`);
 $("close").onclick=close;$("pa").onclick=()=>{const n=prompt("Prodotto");if(!n?.trim())return;data.pantry.push({name:n.trim(),qty:Number(prompt("Quantità","1"))||0,min:Number(prompt("Soglia minima","1"))||0});save();pantry()};
 $("sheet").querySelectorAll("[data-pm]").forEach(e=>e.onclick=()=>{const p=data.pantry[+e.dataset.pm];p.qty=Math.max(0,(p.qty||0)-1);save();pantry()});$("sheet").querySelectorAll("[data-pp]").forEach(e=>e.onclick=()=>{const p=data.pantry[+e.dataset.pp];p.qty=(p.qty||0)+1;save();pantry()});$("sheet").querySelectorAll("[data-pd]").forEach(e=>e.onclick=()=>{data.pantry.splice(+e.dataset.pd,1);save();pantry()});
}

function cats(){
 const rows=data.cats.map((c,i)=>`<div class="item"><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.section)} · ${c.selected===false?"Esclusa":euro(c.budget)}</div></div><button class="gray small" data-editcat="${i}">✏️</button><button class="gray small" data-delcat="${i}">×</button></div>`).join("");
 open(`<h2>🗂️ Categorie</h2>${rows}<button id="addcat" style="width:100%;margin-top:8px">＋ Nuova categoria</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);$("close").onclick=close;
 $("addcat").onclick=()=>{const n=prompt("Nome categoria");if(!n?.trim())return;data.cats.push({section:"🛒 SPESA ALIMENTARE",name:n.trim(),budget:0,selected:false,note:"",items:[]});save();cats();render()};
 $("sheet").querySelectorAll("[data-editcat]").forEach(e=>e.onclick=()=>{const c=data.cats[+e.dataset.editcat],n=prompt("Nome categoria",c.name);if(n?.trim())c.name=n.trim();const note=prompt("Descrizione prodotti",c.note||"");if(note!==null)c.note=note;save();cats();render()});
 $("sheet").querySelectorAll("[data-delcat]").forEach(e=>e.onclick=()=>{const i=+e.dataset.delcat;if(catSum(data.cats[i])>0){alert("Non puoi eliminare una categoria con spese registrate.");return}if(confirm("Eliminare la categoria?")){data.cats.splice(i,1);save();cats();render()}});
}

function backup(){
 open(`<h2>💾 Backup</h2><p class="muted">Salva budget, categorie, acquisti, lista, prodotti, offerte, supermercati, dispensa e storico.</p><button id="export" style="width:100%">⬇️ Esporta backup</button><button class="gray" id="imp" style="width:100%;margin-top:6px">⬆️ Importa backup</button><input id="file" type="file" accept=".json,application/json" hidden><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="spesa-budget-v7.3-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("imp").onclick=()=>$("file").click();$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=migrate(JSON.parse(r.result));save();close();render();alert("Backup importato.");}catch(x){alert("Backup non valido.")}};r.readAsText(f)};
}

function settings(){
 open(`<h2>⚙️ Impostazioni</h2><div class="stat"><b>Spesa — Budget V7.3</b><div class="muted">I budget non sono preimpostati. Li scegli tu quando vuoi.</div></div><button id="reset" style="width:100%">↺ Azzera budget e categorie</button><button class="danger" id="wipe" style="width:100%;margin-top:6px">🗑️ Elimina tutti i dati</button><button class="gray" id="close" style="width:100%;margin-top:6px">Chiudi</button>`);
 $("close").onclick=close;
 $("reset").onclick=()=>{if(confirm("Azzera il budget generale e tutti i budget delle categorie? Gli scontrini e i prodotti NON verranno cancellati.")){data.budget=0;data.budgetConfigured=false;data.categoryBudgetsConfigured=false;data.cats.forEach(c=>{c.budget=0;c.selected=false});save();close();render()}};
 $("wipe").onclick=()=>{if(confirm("Eliminare tutti i dati?")){data=fresh();save();close();render()}};
}

$("main").onclick=e=>{const a=e.target.closest("[data-add]"),n=e.target.closest("[data-name]"),ed=e.target.closest("[data-edit]");if(a||n)openPurchase(+(a?.dataset.add??n.dataset.name));else if(ed){const [i,j]=ed.dataset.edit.split(",").map(Number);editPurchase(i,j)}};
$("setBudget").onclick=setBudget;$("budgetCats").onclick=budgetCats;$("budgetCats2").onclick=budgetCats;$("settings").onclick=settings;$("finish").onclick=finishShopping;$("new").onclick=newShopping;
$("listBtn").onclick=list;$("productsBtn").onclick=products;$("priceCatalogBtn").onclick=priceCatalog;$("pantryBtn").onclick=pantry;$("statsBtn").onclick=stats;$("historyBtn").onclick=history;$("marketBtn").onclick=supermarkets;$("searchBtn").onclick=search;$("catsBtn").onclick=cats;$("backupBtn").onclick=backup;
render();
</script>
</body>
</html>
